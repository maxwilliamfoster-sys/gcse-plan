/* ============================================================
   GCSE Plan — calm UI on Basecoat (shadcn/ui tokens).
   Colour carries one meaning only: which subject. Everything else is ink on paper.
   One family: Atkinson Hyperlegible Next, built for legibility.
   ============================================================ */
:root{
  --font:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --maths:#2563EB; --science:#059669; --englang:#DC2626; --englit:#7C3AED; --hist:#C2410C; --german:#DB2777;
  --c0:var(--border); --c1:#DC2626; --c2:#EA580C; --c3:#CA8A04; --c4:#65A30D; --c5:#16A34A;
  --ok:#16A34A; --warn:#B45309; --bad:#DC2626;
  --tint-pct:9%;
  --wrap:720px;
}
.dark{
  --maths:#60A5FA; --science:#34D399; --englang:#F87171; --englit:#A78BFA; --hist:#FB923C; --german:#F472B6;
  --c1:#F87171; --c2:#FB923C; --c3:#FACC15; --c4:#A3E635; --c5:#4ADE80;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --tint-pct:16%;
}
html{color-scheme:light}
.dark{color-scheme:dark}
html,body{background:var(--background);color:var(--foreground)}
body{margin:0;font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-underline-offset:3px}
p a,li a,.note a{color:var(--foreground);text-decoration:underline;text-decoration-color:color-mix(in oklab,currentColor 35%,transparent)}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.012em;text-wrap:balance;line-height:1.2}
h1{font-size:1.75rem} h2{font-size:1.15rem} h3{font-size:1.02rem}
p{margin:0}
ol,ul{margin:0}
.muted{color:var(--muted-foreground)} .small{font-size:.9rem} .tiny{font-size:.8rem}
.num{font-variant-numeric:tabular-nums} .center{text-align:center}
.err{color:var(--bad);font-weight:600} .ok{color:var(--ok);font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ico{width:20px;height:20px;flex:none} .ico.xs{width:14px;height:14px}
.row{display:flex;align-items:center;gap:10px} .row.wrap,.wrap-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.label{font-size:.85rem;font-weight:700;color:var(--muted-foreground);display:flex;align-items:center;gap:6px;margin-top:4px}
.lead{font-size:1.02rem;max-width:62ch}
.foot{margin-top:28px;max-width:70ch}
.btn.full{width:100%;white-space:normal;min-height:44px;height:auto;padding-block:10px}
.btn[data-variant=success]{background:var(--ok);color:#fff}
.dark .btn[data-variant=success]{color:#052e16}
.btn .ico{width:16px;height:16px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--foreground);text-decoration:underline;cursor:pointer}

/* ---------- top bar + navigation ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--background) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1100px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:5px;text-decoration:none;font-size:1.05rem;letter-spacing:-.01em}
.brand b{font-weight:800} .brand span{color:var(--muted-foreground);font-weight:500}
.toptabs{display:none}
.stats{margin-left:auto;display:flex;align-items:center;gap:2px}
.stat{display:inline-flex;align-items:center;gap:4px;padding:6px 7px;border-radius:8px;font-weight:700;font-size:.95rem;text-decoration:none;color:var(--muted-foreground)}
.stat .ico{width:17px;height:17px}
.stat.hot{color:#EA580C}
a.stat:hover{background:var(--accent)}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:color-mix(in oklab,var(--background) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:.72rem;font-weight:600;text-decoration:none;color:var(--muted-foreground);position:relative}
.nav a .ico{width:22px;height:22px}
.nav a[aria-current=page]{color:var(--foreground)}
.nav a[aria-current=page]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--foreground)}
@media (min-width:900px){
  .nav{display:none}
  .toptabs{display:flex;gap:2px;margin-left:18px}
  .toptabs a{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:8px;font-size:.93rem;font-weight:600;text-decoration:none;color:var(--muted-foreground)}
  .toptabs a:hover{background:var(--accent);color:var(--foreground)}
  .toptabs a[aria-current=page]{background:var(--secondary);color:var(--foreground)}
  .toptabs .ico{width:17px;height:17px}
}
.page{max-width:var(--wrap);margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.page{padding-bottom:64px}}

/* ---------- page furniture ---------- */
.phead{margin-bottom:18px;display:flex;flex-direction:column;gap:6px}
.phead .muted{max-width:60ch}
.back{display:inline-flex;align-items:center;gap:2px;margin-left:-6px;padding:4px 6px;border-radius:6px;font-size:.9rem;font-weight:600;color:var(--muted-foreground);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--foreground);background:var(--accent)}
.back .ico{width:17px;height:17px}
.sect{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.panel{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.panel[data-tone=ok]{border-color:color-mix(in oklab,var(--ok) 45%,var(--border))}
.panel[data-tone=warn]{border-color:color-mix(in oklab,var(--warn) 45%,var(--border))}
.pts{padding-left:1.2em;display:flex;flex-direction:column;gap:5px;list-style:disc}
.pts li::marker{color:var(--muted-foreground)}
.how{padding-left:1.4em;display:flex;flex-direction:column;gap:6px;list-style:decimal}
.how li::marker{color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--border);font-size:.82rem;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted-foreground));flex:none}
.bar{height:6px;border-radius:999px;background:var(--muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--foreground));transition:width .3s}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--muted);font-size:.93rem}
.note .ico{width:18px;height:18px;margin-top:2px;color:var(--muted-foreground)}
.note[data-tone=warn],.note[data-tone=yellow]{background:color-mix(in oklab,var(--warn) 13%,var(--background))}
.note[data-tone=warn] .ico,.note[data-tone=yellow] .ico{color:var(--warn)}
.notes{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--muted);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg a{flex:1;white-space:nowrap;text-align:center;padding:7px 12px;border-radius:8px;font-size:.9rem;font-weight:600;text-decoration:none;color:var(--muted-foreground)}
.seg a[aria-current=page]{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chips a{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 11px;border-radius:999px;border:1px solid var(--border);font-size:.86rem;font-weight:600;text-decoration:none;color:var(--muted-foreground)}
.chips a[aria-current=page]{background:var(--foreground);color:var(--background);border-color:var(--foreground)}
.chips a[aria-current=page] .dot{box-shadow:0 0 0 2px var(--background)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px}
.links.col{flex-direction:column;gap:8px}
.xlink{display:inline-flex;align-items:center;gap:4px;font-size:.9rem;font-weight:600;text-decoration:underline;text-decoration-color:color-mix(in oklab,currentColor 30%,transparent)}
.xlink .ico{color:var(--muted-foreground)}
.vids{list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.vids a{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;margin-inline:-8px;border-radius:8px;text-decoration:none}
.vids a:hover{background:var(--accent)}
.vids .play{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--muted);flex:none}
.vids .play .ico{width:11px;height:11px;fill:currentColor}
.vids .t{display:block;font-size:.92rem;font-weight:600;line-height:1.3}
.vids .meta{display:block;font-size:.8rem;color:var(--muted-foreground)}
.vgroup{display:flex;flex-direction:column;gap:2px}
details.explain{border-top:1px solid var(--border);padding-top:10px;margin-top:22px}
details.explain summary{cursor:pointer;font-weight:600;font-size:.93rem;color:var(--muted-foreground)}
details.explain[open] summary{margin-bottom:8px}

/* ---------- today: header, now card, the bell-time rail ---------- */
.dayhead{display:flex;align-items:center;gap:6px;margin:0 -6px 16px}
.dayhead h1{font-size:1.9rem}
.dayhead p{font-size:.92rem}
.now{position:relative;border-radius:14px;padding:18px 18px 16px;margin-bottom:16px;background:color-mix(in oklab,var(--c,var(--foreground)) var(--tint-pct),var(--background));border:1px solid color-mix(in oklab,var(--c,var(--foreground)) 30%,var(--border));display:flex;flex-direction:column;gap:6px}
.now::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--foreground))}
.now-k{font-size:.88rem;font-weight:700;color:color-mix(in oklab,var(--c,var(--foreground)) 75%,var(--foreground))}
.now h2{font-size:1.45rem}
.now-topic{font-size:1rem}
.now-bar{height:4px;border-radius:4px;background:color-mix(in oklab,var(--c,var(--foreground)) 18%,transparent);margin:6px 0 4px;overflow:hidden}
.now-bar i{display:block;height:100%;background:var(--c,var(--foreground))}
.now .row{margin-top:6px}
.now.done-day{background:var(--muted);border-color:transparent}
.now.done-day::before{display:none}
.dayprog{display:flex;align-items:center;gap:12px;font-size:.86rem;color:var(--muted-foreground);margin:4px 0 10px}
.dayprog .bar{flex:1;max-width:240px}
.timeline{list-style:none;padding:0;margin:0;position:relative}
.tl-item{display:grid;grid-template-columns:50px 18px 1fr auto;column-gap:10px;align-items:start;position:relative;padding:4px 0}
.tl-item::before{content:"";position:absolute;left:68px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item:first-child::before{top:18px}
.tl-item:last-child::before{bottom:calc(100% - 18px)}
.tl-time{grid-column:1;text-align:right;font-size:.88rem;font-weight:700;padding-top:9px;line-height:1.15}
.tl-time small{display:block;font-size:.76rem;font-weight:500;color:var(--muted-foreground)}
.tl-dot{grid-column:2;position:relative;z-index:1;margin-top:11px;width:14px;height:14px;border-radius:50%;background:var(--background);border:3px solid var(--c,var(--muted-foreground));display:grid;place-items:center}
.tl-dot .ico{width:10px;height:10px;stroke-width:3.5;color:#fff}
.tl-item.is-done .tl-dot{background:var(--c,var(--muted-foreground))}
.tl-body{grid-column:3;min-width:0;border-radius:10px;padding:6px 10px;margin-left:-4px}
.tl-body>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;column-gap:8px}
.tl-body>summary::-webkit-details-marker{display:none}
.tl-head{grid-column:1;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;padding-top:3px}
.tl-title{font-weight:700}
.tl-focus{grid-column:1;font-size:.9rem;color:var(--muted-foreground);line-height:1.4}
.tl-chev{grid-row:1/span 2;grid-column:2;align-self:center;width:18px;height:18px;color:var(--muted-foreground);transition:transform .15s}
details[open]>summary .tl-chev{transform:rotate(180deg)}
.tl-body>summary:hover .tl-title{text-decoration:underline;text-underline-offset:3px}
.tl-more{display:flex;flex-direction:column;gap:12px;padding:12px 0 8px}
.tl-item .badge .ico{width:12px;height:12px}
.tl-item.is-now .tl-body{background:color-mix(in oklab,var(--c,var(--foreground)) var(--tint-pct),var(--background));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c,var(--foreground)) 30%,var(--border))}
.tl-item.is-now .tl-dot{box-shadow:0 0 0 4px color-mix(in oklab,var(--c,var(--foreground)) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){.tl-item.is-now .tl-dot{animation:pulse 2.4s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in oklab,var(--c,var(--foreground)) 10%,transparent)}}
.tl-item.is-done .tl-title{color:var(--muted-foreground)}
.tl-item.k-break,.tl-item.k-rest,.tl-item.k-eve{color:var(--muted-foreground)}
.tl-item.k-break .tl-dot,.tl-item.k-eve .tl-dot{width:8px;height:8px;border-width:0;background:var(--border);margin:14px auto 0}
.tl-item.k-break .tl-title,.tl-item.k-eve .tl-title,.tl-item.k-rest .tl-title{font-weight:600}
.tl-item.k-break .tl-body,.tl-item.k-eve .tl-body,.tl-item.k-rest .tl-body{padding-top:9px}
.tl-item.k-live .tl-title{font-weight:800}
.tick{grid-column:4;margin-top:8px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:var(--background);display:grid;place-items:center;color:transparent;cursor:pointer}
.tick:hover{border-color:var(--muted-foreground);color:var(--muted-foreground)}
.tick[aria-pressed=true]{background:var(--c,var(--foreground));border-color:var(--c,var(--foreground));color:#fff}
.tick .ico{width:16px;height:16px;stroke-width:3}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:12px;border-radius:10px;background:var(--background);border:1px solid var(--border)}
.pick-t{font-weight:700}
.pick-t a{text-decoration:underline;text-decoration-color:color-mix(in oklab,currentColor 30%,transparent)}
.dayfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
@media (max-width:420px){
  .tl-item{grid-template-columns:42px 14px 1fr auto;column-gap:8px}
  .tl-item::before{left:56px}
  .tl-dot{width:12px;height:12px}
  .dayhead h1{font-size:1.6rem}
}

/* ---------- week ---------- */
.weekgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.weekgrid{grid-template-columns:1fr 1fr}}
.wday{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--border);border-radius:12px;text-decoration:none;background:var(--card)}
.wday:hover{border-color:var(--muted-foreground)}
.wday.is-today{border-color:var(--foreground);box-shadow:inset 0 0 0 1px var(--foreground)}
.wday-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wday ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:3px}
.wday li{display:grid;grid-template-columns:44px 10px 1fr auto;gap:8px;align-items:center;font-size:.9rem}
.wday li .num{color:var(--muted-foreground);font-size:.82rem}
.focuslist{list-style:none;padding:0;display:flex;flex-direction:column}
.focuslist a{display:grid;grid-template-columns:10px 9.5em 1fr;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--border);text-decoration:none;font-size:.93rem}
.focuslist li:last-child a{border-bottom:0}
@media (max-width:560px){.focuslist a{grid-template-columns:10px 1fr}.focuslist a span{grid-column:2}}

/* ---------- plan ---------- */
.road{list-style:none;padding:0;display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:20px 1fr;gap:14px;position:relative;padding-bottom:20px}
.stage::before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--border)}
.stage:last-child::before{display:none}
.stage .pin{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);background:var(--background);display:grid;place-items:center;margin-top:2px}
.stage .pin .ico{width:12px;height:12px;stroke-width:3}
.stage.past .pin{background:var(--muted-foreground);border-color:var(--muted-foreground);color:var(--background)}
.stage.past h3,.stage.past p{color:var(--muted-foreground)}
.stage.now .pin{border-color:var(--foreground);box-shadow:inset 0 0 0 4px var(--background);background:var(--foreground)}

        'High temperature or wrong pH changes the active site shape — the enzyme is denatured.',
        'Carbohydrase (amylase) → starch to sugars. Protease → proteins to amino acids. Lipase → lipids to fatty acids + glycerol.',
        'Bile is made in the liver and stored in the gall bladder. It neutralises stomach acid and emulsifies fat (bigger surface area).',
        'Food tests: Benedict\'s (heat) blue → brick red for sugar. Iodine orange → blue-black for starch. Biuret blue → purple for protein. Ethanol → cloudy white for lipids.',
        'Required practical: effect of pH on amylase. Time how long until iodine stops turning blue-black.'],
      cards: [['What does protease produce?', 'Amino acids'], ['Products of lipase', 'Fatty acids and glycerol'], ['Two roles of bile', 'Neutralises stomach acid; emulsifies fats'],
        ['Test and positive result for protein', 'Biuret: blue → purple'], ['Test for starch', 'Iodine: orange-brown → blue-black'], ['Why does a denatured enzyme stop working?', 'Its active site changes shape, so the substrate no longer fits']],
      ex: 'Write the method for the amylase practical from memory (with the control variables), then check a mark scheme.' },
    { id: 'b-heart', n: 'Heart, blood & lungs', p: ['sb1'], w: 3,
      pts: ['Double circulatory system: right side pumps blood to the lungs, left side pumps it to the body.',
        'Route: vena cava → right atrium → right ventricle → pulmonary artery → lungs → pulmonary vein → left atrium → left ventricle → aorta.',
        'Pacemaker cells in the right atrium set the heart rate. Artificial pacemakers fix irregular rhythms.',
        'Arteries: thick muscular, elastic walls (high pressure). Veins: valves and a large lumen. Capillaries: walls one cell thick for exchange.',
        'Blood: red cells (haemoglobin, no nucleus, biconcave), white cells (defence), platelets (clotting), plasma (transports everything).',
        'Coronary heart disease: fatty deposits narrow the coronary arteries. Treatments: stents, statins, transplants, replacement valves.'],
      cards: [['Which side of the heart pumps to the lungs?', 'Right'], ['Why do arteries have thick walls?', 'To withstand high pressure'],
        ['Why are capillary walls one cell thick?', 'Short diffusion distance'], ['Role of platelets', 'Help the blood clot'],
        ['Advantage and disadvantage of statins', 'Lower blood cholesterol / must be taken long-term and have side effects']],
      ex: 'Trace a drop of blood through the heart aloud, then answer a 6-marker comparing stents and statins.' },
    { id: 'b-disease', n: 'Non-communicable disease & plants', p: ['sb1'], w: 2,
      pts: ['Health is physical and mental wellbeing. Risk factors: smoking (lung disease, cancer), obesity (Type 2 diabetes), alcohol (liver, brain), carcinogens and radiation (cancer).',
        'Benign tumours stay in one place. Malignant tumours invade tissue and spread in the blood (secondary tumours).',
        'Plant tissues: epidermis, palisade mesophyll (photosynthesis), spongy mesophyll (air spaces), xylem, phloem, meristem.',
        'Xylem carries water and minerals up (transpiration stream). Phloem carries dissolved sugars both ways (translocation).',
        'Stomata, opened and closed by guard cells, control gas exchange and water loss.',
        'Transpiration is faster when it is warmer, drier, windier and brighter.'],
      cards: [['Difference between benign and malignant tumours', 'Malignant tumours invade tissue and spread via the blood'], ['What does phloem transport?', 'Dissolved sugars (translocation)'],
        ['Four factors that increase transpiration', 'Temperature, light intensity, air movement, lower humidity'], ['What controls stomata?', 'Guard cells']],
      ex: 'Answer an exam question interpreting data on a risk factor (correlation vs causation) and one on transpiration.' },
    { id: 'b-infection', n: 'Infection & response', p: ['sb1'], w: 3,
      pts: ['Pathogens: viruses (measles, HIV, tobacco mosaic virus), bacteria (Salmonella, gonorrhoea), fungi (rose black spot), protists (malaria — spread by mosquitoes).',
        'Spread by air, water or direct contact. Reduce by hygiene, isolation, destroying vectors, vaccination.',
        'Non-specific defences: skin, nose hairs and mucus, cilia in the trachea, stomach acid.',
        'White blood cells: phagocytosis, producing antibodies, producing antitoxins.',
        'Vaccination: dead or inactive pathogen → white cells make antibodies and memory cells → fast response later. Herd immunity protects others.',
        'Antibiotics kill bacteria but NOT viruses. Resistance is increasing. Drug testing: pre-clinical (cells, animals) → clinical trials, double-blind with a placebo.',
        'Drug origins: digitalis from foxgloves (heart drug), aspirin from willow (painkiller), penicillin discovered by Alexander Fleming from Penicillium mould. Most new drugs are now made by chemists.'],
      cards: [['Why can\'t antibiotics treat viral infections?', 'Viruses live inside cells; antibiotics only kill bacteria'], ['Three ways white blood cells defend us', 'Phagocytosis, antibodies, antitoxins'],
        ['What is a double-blind trial?', 'Neither patients nor doctors know who gets the drug or the placebo'], ['How is malaria spread?', 'By mosquitoes (vector), protist pathogen'],
        ['How does vaccination work?', 'Inactive pathogen triggers antibodies and memory cells, so a later infection is fought quickly'],
        ['Where do digitalis, aspirin and penicillin come from?', 'Foxgloves, willow, Penicillium mould (Fleming)']],
      ex: 'Make a table of the 7 named diseases (pathogen type, spread, symptoms, control), then do one 6-marker on vaccination.' },
    { id: 'b-energy', n: 'Photosynthesis & respiration', p: ['sb1'], w: 3,
      pts: ['Photosynthesis: carbon dioxide + water → glucose + oxygen (light, chlorophyll). 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. Endothermic.',
        'Limiting factors: light intensity, CO₂ concentration, temperature, amount of chlorophyll.',
        'Inverse square law (H): light intensity ∝ 1/distance².',
        'Glucose is used for respiration, starch (storage), cellulose, fats/oils, and amino acids (with nitrate ions).',
        'Aerobic respiration: glucose + oxygen → carbon dioxide + water. Anaerobic in muscles: glucose → lactic acid (oxygen debt, H). In yeast: glucose → ethanol + carbon dioxide.',
        'Required practical: pondweed at different distances from a lamp — count bubbles or measure O₂ volume.'],
      cards: [['Word equation for photosynthesis', 'Carbon dioxide + water → glucose + oxygen'], ['Word equation for aerobic respiration', 'Glucose + oxygen → carbon dioxide + water'],
        ['Anaerobic respiration in muscles produces…', 'Lactic acid'], ['Anaerobic respiration in yeast produces…', 'Ethanol and carbon dioxide'],
        ['Four limiting factors of photosynthesis', 'Light intensity, CO₂ concentration, temperature, chlorophyll'], ['Why does a graph of rate vs light intensity level off?', 'Another factor (CO₂ or temperature) becomes limiting']],
      ex: 'Do a limiting-factor graph question and a 6-marker describing the pondweed practical.' },

    /* ---------- BIOLOGY PAPER 2 ---------- */
    { id: 'b-nerves', n: 'Nervous system & reaction time', p: ['sb2'], w: 2, from: '2027-01-04',
      pts: ['Homeostasis keeps internal conditions (blood glucose, body temperature, water levels) steady. Control systems have receptors, coordination centres (brain, spinal cord, pancreas) and effectors.',
        'Stimulus → receptor → sensory neurone → relay neurone (CNS) → motor neurone → effector → response.',
        'Reflexes are automatic and rapid, and they do not involve the conscious brain. Synapses pass signals chemically across a gap.',
        'The CNS is the brain and spinal cord.',
        'Required practical: ruler-drop reaction time. Repeat, calculate the mean, control the hand and the distractions.'],
      cards: [['Order of a reflex arc', 'Receptor → sensory → relay → motor → effector'], ['How is a signal passed across a synapse?', 'Chemicals diffuse across the gap'],
        ['Why are reflexes fast?', 'They bypass the conscious part of the brain']],
      ex: 'Label a reflex arc from memory and answer a reaction-time practical question.' },
    { id: 'b-hormones', n: 'Hormones, blood glucose & reproduction', p: ['sb2'], w: 3, from: '2027-01-04',
      pts: ['Endocrine glands release hormones into the blood. The pituitary is the "master gland".',
        'Blood glucose too high → pancreas releases insulin → cells take up glucose, liver stores it as glycogen. Too low → glucagon (H) converts glycogen back.',
        'Type 1 diabetes: the pancreas makes no insulin → injections. Type 2: cells stop responding → diet and exercise. Obesity is a risk factor.',
        'Menstrual cycle: FSH (egg matures, oestrogen made), oestrogen (lining builds), LH (ovulation), progesterone (maintains lining).',
        'Contraception: hormonal (pill, implant, injection) and non-hormonal (condoms, diaphragm, IUD, sterilisation, abstinence).',
        'H: thyroxine and adrenaline, negative feedback, and using hormones to treat infertility (IVF).'],
      cards: [['Hormone that lowers blood glucose', 'Insulin'], ['Difference between Type 1 and Type 2 diabetes', 'Type 1: no insulin made. Type 2: cells don\'t respond to insulin'],
        ['Which hormone triggers ovulation?', 'LH'], ['Role of FSH', 'Causes an egg to mature and stimulates oestrogen production'], ['Where is glycogen stored?', 'Liver (and muscles)']],
      ex: 'Draw the blood-glucose feedback loop, then do a 6-marker comparing hormonal and non-hormonal contraception.' },
    { id: 'b-genetics', n: 'Inheritance & variation', p: ['sb2'], w: 3,
      pts: ['DNA is a double helix polymer. A gene codes for a particular protein. The genome is all of an organism\'s genetic material.',
        'Meiosis makes 4 genetically different gametes with half the chromosomes. Fertilisation restores the full number.',
        'Dominant allele shows with one copy. Recessive needs two. Homozygous = same alleles, heterozygous = different.',
        'Punnett squares give probabilities. Cystic fibrosis is recessive. Polydactyly is dominant.',
        'Sex: XX female, XY male — always a 50% chance of either.',
        'Embryo screening raises ethical, economic and social issues.'],
      cards: [['Define allele', 'A different form of the same gene'], ['Genotype vs phenotype', 'Genotype = alleles; phenotype = characteristic shown'],
        ['Two carriers (Ff × Ff) of cystic fibrosis: chance of an affected child?', '25% (1 in 4)'], ['How many cells does meiosis produce?', 'Four genetically different gametes'],
        ['Is polydactyly dominant or recessive?', 'Dominant']],
      ex: 'Do 3 Punnett-square questions (including a family tree) and one embryo-screening evaluation.' },
    { id: 'b-evolution', n: 'Evolution, breeding & classification', p: ['sb2'], w: 2,
      pts: ['Natural selection: variation → better-adapted individuals survive and breed → pass on alleles → over time the species changes.',
        'Evidence: fossils, antibiotic-resistant bacteria.',
        'Selective breeding: choose parents with desired traits over many generations. Risk: inbreeding and reduced variation.',
        'Genetic engineering: a gene is transferred into another organism (e.g. human insulin gene into bacteria, GM crops).',
        'Classification: Linnaean system (kingdom … species, binomial names). Woese\'s three domains: Archaea, Bacteria, Eukaryota.',
        'Extinction causes: new predators, disease, competition, environmental change, catastrophic events.'],
      cards: [['Why are antibiotic-resistant bacteria evidence for evolution?', 'Resistant bacteria survive and reproduce, so resistance spreads — natural selection seen quickly'],
        ['One risk of selective breeding', 'Inbreeding — reduced variation, vulnerable to disease'], ['Woese\'s three domains', 'Archaea, Bacteria, Eukaryota'],
        ['Example of genetic engineering', 'Human insulin gene put into bacteria']],
      ex: 'Write a 6-mark explanation of how antibiotic resistance develops (natural selection steps in order).' },
    { id: 'b-ecology', n: 'Ecology & biodiversity', p: ['sb2'], w: 3, from: '2026-09-02',
      pts: ['Community = all populations in a habitat. Interdependence: species depend on each other for food, shelter, pollination.',
        'Abiotic factors: light, temperature, moisture, soil pH and minerals, wind, CO₂, O₂. Biotic: food, predators, pathogens, competition.',
        'Adaptations: structural, behavioural, functional. Extremophiles live in extreme conditions.',
        'Predator–prey cycles: predator numbers peak after prey numbers.',
        'Required practical: quadrats (random sampling for abundance) and transects (how distribution changes).',
        'Levels of organisation: producers (photosynthesise) → primary → secondary → tertiary consumers; feeding relationships in food chains.',
        'Carbon cycle: photosynthesis removes CO₂; respiration, decomposition and combustion return it. Water cycle: evaporation, condensation, precipitation.',
        'Humans reduce biodiversity through waste, pollution, land use, deforestation (peat bogs, tropical forest) and global warming. Protect it with breeding programmes, hedgerows, reduced deforestation and recycling.'],
      cards: [['Three abiotic factors', 'e.g. light intensity, temperature, soil pH'], ['What is a quadrat used for?', 'Estimating population size / abundance by random sampling'],
        ['What is a transect used for?', 'Showing how distribution changes across a habitat'], ['Two processes that return CO₂ to the air', 'Respiration and combustion (also decomposition)'],
        ['Why does the predator peak come after the prey peak?', 'Predators need time to feed and reproduce after food increases']],
      ex: 'Do a quadrat calculation (mean per quadrat × area) and a 6-marker on the carbon cycle.' },

    /* ---------- CHEMISTRY PAPER 1 ---------- */
    { id: 'c-atoms', n: 'Atoms, the periodic table & separating', p: ['sc1'], w: 3,
      pts: ['Proton: charge +1, mass 1. Neutron: 0, mass 1. Electron: −1, very small mass. Atomic number = protons. Mass number = protons + neutrons.',
        'Isotopes: same number of protons, different number of neutrons.',
        'Model of the atom: tiny spheres → discovery of the electron led to the plum pudding model → alpha scattering showed a small positive nucleus (nuclear model) → Bohr: electrons in shells → Chadwick provided evidence for the neutron.',
        'Electron shells: 2, 8, 8. Group number = outer electrons. Period = number of shells.',
        'Group 1: react with water → metal hydroxide + hydrogen, more reactive down the group. Group 7: less reactive down the group, displacement reactions. Group 0: unreactive (full outer shell).',
        'Separating mixtures: filtration, crystallisation, simple and fractional distillation, chromatography. Mendeleev left gaps for undiscovered elements.'],
      cards: [['Define isotope', 'Atoms of the same element with different numbers of neutrons'], ['What did the alpha-scattering experiment show?', 'Mass is concentrated in a small, positive nucleus'],
        ['Electronic structure of sodium (11)', '2, 8, 1'], ['Why does Group 1 reactivity increase down the group?', 'Outer electron is further from the nucleus, so it is lost more easily'],
        ['Why did Mendeleev leave gaps?', 'For elements not yet discovered, so patterns lined up'], ['Group 1 metal + water →', 'Metal hydroxide + hydrogen']],
      ex: 'Write electron structures for elements 1–20, then do a 6-marker on the development of the atomic model.' },
    { id: 'c-bonding', n: 'Bonding, structure & properties', p: ['sc1'], w: 3,
      pts: ['Ionic: metal + non-metal, electrons transferred, giant lattice, high melting point, conducts when molten or dissolved.',
        'Covalent: non-metals share pairs of electrons. Simple molecules have weak intermolecular forces → low boiling points, don\'t conduct.',
        'Diamond: each C has 4 covalent bonds — very hard, very high melting point, no conduction.',
        'Graphite: each C has 3 bonds, layers slide, delocalised electrons → conducts. Graphene: a single layer. Fullerenes: hollow cages and tubes.',
        'Metallic bonding: positive ions in a sea of delocalised electrons → conducts, malleable. Alloys are harder because different-sized atoms distort the layers.',
        'Polymers: very long molecules joined by strong covalent bonds. Intermolecular forces between them are relatively strong, so they are solid at room temperature.',
        'Draw dot-and-cross diagrams for NaCl, MgO, H₂, Cl₂, H₂O, NH₃, CH₄, HCl.'],
      cards: [['Why does graphite conduct electricity?', 'Each carbon has one delocalised electron that can move'], ['Why are alloys harder than pure metals?', 'Different-sized atoms distort the layers so they cannot slide'],
        ['Why does ionic NaCl have a high melting point?', 'Strong electrostatic forces between oppositely charged ions in a giant lattice need lots of energy to overcome'],
        ['Why do simple molecules have low boiling points?', 'Weak intermolecular forces, not covalent bonds, are broken'], ['When does an ionic compound conduct?', 'When molten or dissolved (ions free to move)']],
      ex: 'Draw 4 dot-and-cross diagrams from memory, then answer a "compare diamond and graphite" 6-marker.' },
    { id: 'c-quant', n: 'Quantitative chemistry', p: ['sc1'], w: 2,
      pts: ['Conservation of mass: total mass of reactants = total mass of products. Mass "lost" is usually a gas escaping.',
        'Relative formula mass (Mr) = sum of the relative atomic masses.',
        'H: moles = mass ÷ Mr. One mole contains 6.02 × 10²³ particles (Avogadro constant).',
        'H: reacting masses — use the mole ratio from the balanced equation. The limiting reactant is used up first.',
        'Concentration (g/dm³) = mass ÷ volume (dm³). 1 dm³ = 1000 cm³.'],
      cards: [['Mr of CO₂ (C = 12, O = 16)', '44'], ['Moles in 88 g of CO₂', '2 mol'], ['Concentration of 10 g in 250 cm³', '40 g/dm³'], ['Avogadro constant', '6.02 × 10²³']],
      ex: 'Do 5 calculations: Mr, % mass, concentration, and (H) two reacting-mass questions.' },
    { id: 'c-changes', n: 'Chemical changes, acids & electrolysis', p: ['sc1'], w: 3,
      pts: ['Reactivity series: K, Na, Li, Ca, Mg, (C), Zn, Fe, (H), Cu. Metals below carbon are extracted by reduction with carbon.',
        'Oxidation is gain of oxygen (H: loss of electrons — OIL RIG).',
        'Acid + metal → salt + hydrogen. Acid + alkali → salt + water. Acid + carbonate → salt + water + carbon dioxide. Neutralisation: H⁺ + OH⁻ → H₂O.',
        'Required practical: making a soluble salt — add excess insoluble base to acid, filter, evaporate, crystallise.',
        'Electrolysis: positive ions to the cathode (−), negative ions to the anode (+). Aluminium from aluminium oxide dissolved in cryolite (lower melting point). Carbon anodes burn away.',
        'Aqueous solutions: hydrogen forms at the cathode if the metal is more reactive than hydrogen. Oxygen forms at the anode unless a halide is present.',
        'Required practical: electrolysis of aqueous solutions with inert electrodes — identify the product at each electrode.'],
      cards: [['Acid + carbonate →', 'Salt + water + carbon dioxide'], ['OIL RIG', 'Oxidation Is Loss, Reduction Is Gain (of electrons)'],
        ['Why is aluminium oxide dissolved in cryolite?', 'Lowers the melting point, saving energy'], ['Electrolysis of NaCl solution: product at cathode', 'Hydrogen'],
        ['Why add excess base when making a salt?', 'To make sure all the acid reacts'], ['Why must carbon anodes be replaced?', 'They react with oxygen to form CO₂']],
      ex: 'Write the salt-making method from memory, then predict electrolysis products for 4 solutions.' },
    { id: 'c-energy', n: 'Energy changes', p: ['sc1'], w: 2,
      pts: ['Exothermic: energy released, temperature rises (combustion, neutralisation, hand warmers).',
        'Endothermic: energy taken in, temperature falls (thermal decomposition, sports injury packs).',
        'Reaction profiles: activation energy is the minimum energy needed to react. Exothermic products are lower than reactants.',
        'H: bond energy calculation — energy to break bonds − energy released making bonds. A negative result means exothermic.',
        'Required practical: temperature change in a polystyrene cup with a lid. Vary the concentration or amount of reactant.'],
      cards: [['Is neutralisation exo- or endothermic?', 'Exothermic'], ['Define activation energy', 'Minimum energy particles need to react'],
        ['Why use a polystyrene cup with a lid?', 'Reduces energy lost to the surroundings'], ['Bond energy: breaking > making means…', 'Endothermic overall']],
      ex: 'Sketch both reaction profiles from memory and do one bond-energy calculation (H).' },

    /* ---------- CHEMISTRY PAPER 2 ---------- */
    { id: 'c-rates', n: 'Rates & equilibrium', p: ['sc2'], w: 3,
      pts: ['Rate = amount of reactant used (or product made) ÷ time.',
        'Collision theory: particles must collide with at least the activation energy. More frequent successful collisions = faster reaction.',
        'Rate increases with temperature, concentration or pressure, surface area, and a catalyst (a catalyst lowers the activation energy and is not used up).',
        'Measure it by gas volume (syringe), mass loss, or a "disappearing cross" (sodium thiosulfate + acid). H: gradient of a tangent gives the rate at a point.',
        'Reversible reactions ⇌ reach equilibrium in a closed system (forward rate = backward rate).',
        'H: Le Chatelier — raising the temperature favours the endothermic direction. Raising the pressure favours the side with fewer gas molecules.'],
      cards: [['How does a catalyst increase rate?', 'Provides a pathway with lower activation energy'], ['Why does higher temperature increase rate?', 'Particles move faster → more frequent collisions, and more have enough energy'],
        ['Define equilibrium', 'Forward and reverse reactions happen at the same rate in a closed system'], ['Why does powder react faster than lumps?', 'Larger surface area → more frequent collisions'],
        ['How do you find the rate at a point on a curve? (H)', 'Draw a tangent and calculate its gradient']],
      ex: 'Plot a rate graph from data, draw a tangent (H), and write a 6-marker on the thiosulfate practical.' },
    { id: 'c-organic', n: 'Organic chemistry & crude oil', p: ['sc2'], w: 2, from: '2026-09-02',
      pts: ['Crude oil is a mixture of hydrocarbons, mostly alkanes CₙH₂ₙ₊₂: methane, ethane, propane, butane.',
        'Fractional distillation: heat and vaporise; fractions condense at different heights. Short chains at the top — low boiling point, runny, very flammable.',
        'Complete combustion: hydrocarbon + oxygen → carbon dioxide + water.',
        'Cracking (catalytic or steam) breaks long alkanes into shorter alkanes and alkenes, which are more useful and in higher demand.',
        'Alkenes have a C=C double bond. Test: bromine water goes from orange to colourless.'],
      cards: [['General formula of alkanes', 'CₙH₂ₙ₊₂'], ['Test for alkenes', 'Bromine water: orange → colourless'], ['Why crack long hydrocarbons?', 'To meet demand for shorter, more useful fuels and to make alkenes for polymers'],
        ['Properties of short-chain hydrocarbons', 'Low boiling point, low viscosity, very flammable'], ['Products of complete combustion', 'Carbon dioxide and water']],
      ex: 'Draw and explain the fractionating column, then balance 3 combustion and cracking equations.' },
    { id: 'c-analysis', n: 'Chemical analysis', p: ['sc2'], w: 2, from: '2026-11-02',
      pts: ['A pure substance is a single element or compound, with a sharp melting and boiling point.',
        'Formulations are mixtures in exact proportions for a purpose (paint, medicines, fuels).',
        'Chromatography: Rf = distance moved by the spot ÷ distance moved by the solvent. A pure substance gives one spot. Draw the start line in pencil.',
        'Gas tests: hydrogen — squeaky pop with a lit splint. Oxygen — relights a glowing splint. CO₂ — limewater turns milky. Chlorine — bleaches damp litmus paper.'],
      cards: [['Rf formula', 'Distance moved by spot ÷ distance moved by solvent'], ['Test for oxygen', 'Relights a glowing splint'], ['Test for chlorine', 'Bleaches damp litmus paper white'],
        ['Why draw the chromatography baseline in pencil?', 'Pencil doesn\'t dissolve in the solvent'], ['How do you tell a pure substance?', 'Sharp, specific melting/boiling point']],
      ex: 'Calculate 3 Rf values and answer the chromatography required-practical questions.' },
    { id: 'c-atmos', n: 'The atmosphere', p: ['sc2'], w: 2, from: '2027-01-04',
      pts: ['Early atmosphere: volcanoes released mainly CO₂, with water vapour and nitrogen. Water vapour condensed to form oceans.',
        'Algae and plants photosynthesised → oxygen increased and CO₂ decreased. CO₂ was locked into sedimentary rocks and fossil fuels.',
        'Now: about 80% nitrogen, about 20% oxygen, small amounts of CO₂, water vapour and noble gases.',
        'Greenhouse gases (CO₂, methane, water vapour) absorb infrared radiation. Human activity increases CO₂ (combustion, deforestation) and methane (farming, landfill).',
        'Pollutants: carbon monoxide (toxic, incomplete combustion), sulfur dioxide and nitrogen oxides (acid rain, breathing problems), soot particulates (global dimming).',
        'Carbon footprint = total greenhouse gases over a product\'s life cycle.'],
      cards: [['Main gas in the early atmosphere', 'Carbon dioxide'], ['Why did oxygen increase?', 'Photosynthesis by algae and plants'], ['Why is carbon monoxide dangerous?', 'Toxic — stops blood carrying oxygen'],
        ['Two human sources of methane', 'Farming (cattle, rice) and landfill'], ['Rough composition of air today', '~80% nitrogen, ~20% oxygen']],
      ex: 'Write a 6-marker on how the atmosphere has changed, then a climate-change evaluation.' },
    { id: 'c-resources', n: 'Using resources & water', p: ['sc2'], w: 2, from: '2027-01-04',
      pts: ['Potable water is safe to drink. UK fresh water: filtered, then sterilised (chlorine, ozone or UV). Sea water: desalination by distillation or reverse osmosis (costly in energy).',
        'Waste water: screening → sedimentation → anaerobic digestion of sludge, aerobic treatment of effluent.',
        'H: phytomining (plants absorb metal, then burn to ash) and bioleaching (bacteria) extract low-grade copper ores.',
        'Life cycle assessment: raw materials, manufacture, use, disposal.',
        'Reduce, reuse, recycle to save resources and energy.',
        'Required practical: analyse and purify water — test pH, evaporate to find dissolved solids, distil.'],
      cards: [['Two ways to sterilise water', 'Chlorine, ozone or UV light'], ['Why is desalination expensive?', 'Needs lots of energy'], ['Four stages of a life cycle assessment', 'Raw materials, manufacture, use, disposal'],
        ['What is phytomining? (H)', 'Plants absorb metal compounds; burned to give ash rich in metal']],
      ex: 'Answer a life-cycle-assessment comparison question (e.g. paper vs plastic bags).' },

    /* ---------- PHYSICS PAPER 1 ---------- */
    { id: 'p-energy', n: 'Energy', p: ['sp1'], w: 3,
      pts: ['Energy stores: kinetic, gravitational potential, elastic, thermal, chemical, magnetic, electrostatic, nuclear.',
        'Kinetic energy = ½mv². GPE = mgh. Elastic PE = ½ke².',
        'Specific heat capacity: ΔE = mcΔθ. Required practical: heat a block with an immersion heater, measure energy in and temperature rise.',
        'Power = energy ÷ time = work done ÷ time. Efficiency = useful output ÷ total input.',
        'Reduce unwanted transfers with lubrication and thermal insulation. Thicker, lower-conductivity walls lose heat more slowly.',
        'Resources: renewable (solar, wind, hydro, tidal, wave, geothermal, biofuel) vs non-renewable (coal, oil, gas, nuclear). Compare reliability, cost and environmental impact.'],
      cards: [['Kinetic energy equation', 'Eₖ = ½mv²'], ['GPE equation', 'Eₚ = mgh'], ['Specific heat capacity equation', 'ΔE = mcΔθ'],
        ['Efficiency', 'Useful output ÷ total input'], ['One advantage and one disadvantage of wind power', 'Renewable, no CO₂ / unreliable and visual impact'], ['Unit of power', 'Watt (W) = J/s']],
      ex: 'Do 5 energy calculations (including rearranging ½mv²) and one 6-marker comparing energy resources.' },
    { id: 'p-elec', n: 'Electricity', p: ['sp1'], w: 3,
      pts: ['Charge Q = It. Potential difference V = IR. Power P = VI = I²R. Energy E = Pt = QV.',
        'Series: same current everywhere, p.d. shared, R total = R₁ + R₂. Parallel: same p.d. on each branch, currents add, total R is less than the smallest.',
        'I–V graphs: fixed resistor is a straight line through the origin. Filament lamp curves (resistance rises with temperature). Diode lets current flow one way only.',
        'LDR: resistance falls as light increases. Thermistor: resistance falls as temperature increases.',
        'UK mains: 230 V, 50 Hz a.c. Live (brown), neutral (blue), earth (green/yellow). Fuses and earthing are for safety.',
        'National Grid: step-up transformers raise the p.d. (lower current, less energy loss); step-down transformers make it safe for homes.',
        'Required practicals: resistance (length of a wire; resistors in series and parallel) and I–V characteristics of a resistor, filament lamp and diode.'],
      cards: [['V = ?', 'IR'], ['Resistance in parallel is…', 'Less than the smallest individual resistor'], ['What happens to an LDR in bright light?', 'Resistance decreases'],
        ['Colour of the live wire', 'Brown'], ['Why does the National Grid use high voltage?', 'Lower current → less energy lost as heat in cables'], ['UK mains frequency and p.d.', '50 Hz, 230 V']],
      ex: 'Do 4 circuit calculations, then sketch the three I–V graphs from memory and explain the filament lamp.' },
    { id: 'p-particles', n: 'Particle model of matter', p: ['sp1'], w: 2,
      pts: ['Density ρ = m ÷ V. Required practical: regular shapes (measure dimensions) and irregular shapes (displacement / eureka can).',
        'Solids → liquids → gases: particles get further apart and move more. Density is usually lowest as a gas.',
        'Internal energy = kinetic + potential energy of the particles. Heating raises temperature OR changes state.',
        'Specific latent heat: E = mL. Fusion = melting/freezing. Vaporisation = boiling/condensing. Temperature stays constant during a change of state.',
        'Gas pressure: particles collide with the walls. Hotter at constant volume → faster particles → more frequent, harder collisions → higher pressure.'],
      cards: [['Density equation', 'ρ = m/V'], ['Why is temperature constant while ice melts?', 'Energy breaks bonds (raises potential energy) instead of kinetic energy'],
        ['Specific latent heat equation', 'E = mL'], ['Why does gas pressure rise when heated in a sealed container?', 'Particles move faster, hitting the walls more often and harder']],

    { id: 'pc-1', n: 'Power & Conflict: Ozymandias · London · The Prelude · My Last Duchess · Charge of the Light Brigade', p: ['lit2'], w: 3,

    { id: 'pc-2', n: 'Power & Conflict: Exposure · Storm on the Island · Bayonet Charge · Remains · Poppies', p: ['lit2'], w: 3,

    { id: 'pc-3', n: 'Power & Conflict: War Photographer · Tissue · The Émigrée · Checking Out Me History · Kamikaze', p: ['lit2'], w: 3,
      pts: ['War Photographer (Duffy, 1985): a photographer develops his "spools of suffering set out in ordered rows" in his darkroom. Readers’ eyes "prick with tears between the bath and pre-lunch beers" — then they do not care. Ordered stanzas contrast with chaos.',

    if (day && day.subj) for (const s in day.subj) if (s in tally) tally[s] += day.subj[s] * Math.pow(0.93, k);

  score += t.w * 1.5;

/* ---------- flashcards (Leitner) ---------- */
const BOX_DAYS = [0, 1, 3, 7, 14, 30];

  ts.sort((a, b) => {

  let cur = null, next = null;
  for (const it of timed) {
    const a = toMin(it.start), b = /:/.test(it.end || '') ? toMin(it.end) : a + 1;
    if (mins >= a && mins < b) cur = it;
    if (a > mins && !next && it.kind !== 'break' && it.kind !== 'rest') next = it;
  }
  return { cur, next };
}

/* ---------- XP, streak, sound ---------- */
function addXP(n) {
  if (!n) return;
  state.xp = (state.xp || 0) + n;
  const d = D.today(), day = state.days[d] || (state.days[d] = { m: 0, subj: {} });
  day.xp = (day.xp || 0) + n;
  if (sess) sess.xp = (sess.xp || 0) + n;
}
function activeOn(d) { const y = state.days[d]; return !!(y && ((y.m || 0) > 0 || (y.xp || 0) > 0)); }
function streak() { let d = D.today(), n = 0; if (!activeOn(d)) d = D.add(d, -1); while (activeOn(d)) { n++; d = D.add(d, -1); } return n; }
const Sound = {
  ctx: null,
  on() { return state.settings.sound !== false; },
  c() { if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this.ctx = new C(); } if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; },
  play(notes, type, vol) {
    if (!this.on()) return; const c = this.c(); if (!c) return;
    let t = c.currentTime + 0.01;
    for (const [f, dur, gap] of notes) {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.03); t += gap;
    }
  },
  correct() { this.play([[784, 0.14, 0.09], [1175, 0.24, 0]], 'sine', 0.14); },
  wrong() { this.play([[247, 0.16, 0.12], [196, 0.26, 0]], 'triangle', 0.12); },
  tick() { this.play([[988, 0.07, 0]], 'sine', 0.07); },
  win() { this.play([[523, 0.14, 0.11], [659, 0.14, 0.11], [784, 0.14, 0.11], [1047, 0.4, 0]], 'sine', 0.14); },
};
function buzz(ms) { try { const ua = navigator.userActivation; if (navigator.vibrate && (!ua || ua.hasBeenActive)) navigator.vibrate(ms); } catch (e) { /* not supported */ } }
function xpFloat(n, el) {
  const f = document.createElement('div'); f.className = 'xpfloat'; f.textContent = '+' + n + ' XP';
  const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0 };
  f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top - 6) + 'px';

}

/* ---------- router ----------

let R = { tab: 'today', parts: [], q: {} }, cardsSubj = null;
const TABS = [['today', 'Today', 'today'], ['week', 'Week', 'week'], ['subjects', 'Subjects', 'book'], ['practice', 'Practice', 'layers'], ['plan', 'Plan', 'map']];

function parseHash() {
  let h = location.hash.replace(/^#\/?/, '');
  // links from the old app: #cards, #more, #subjects-<id>
  const legacy = h.match(/^(today|plan|subjects|cards|more|rate)(?:-(.+))?$/);
  if (legacy) h = legacy[1] === 'cards' ? 'practice' : legacy[1] === 'more' ? 'settings' : legacy[2] ? (TOPIC[legacy[2]] ? 'topic/' + legacy[2] : 'subjects/' + legacy[2]) : legacy[1];
  const [p, qs] = h.split('?');
  const parts = p.split('/').filter(Boolean).map(decodeURIComponent);
  const tab = parts.shift() || 'today';
  const q = {}; new URLSearchParams(qs || '').forEach((v, k) => { q[k] = v; });
  R = { tab: ['today', 'week', 'subjects', 'topic', 'rate', 'practice', 'plan', 'settings'].includes(tab) ? tab : 'today', parts, q };

/* ---------- multiple-choice quizzes ----------

  if (keys.length <= 1) return ts.length ? [{ id: 'p-' + s.id + '-all', sid: s.id, name: s.name + ' · all topics', desc: 'Questions from every ' + s.name + ' topic', n: count('all') }] : [];

}
function quizList() {
  const order = ['hist', 'german'].concat(RG.subjects.map((x) => x.id).filter((id) => id !== 'hist' && id !== 'german'));
  const out = DECKS.filter((dk) => !(dk.h && state.settings.tiers.german === 'F'))
    .map((dk) => ({ id: 'q-' + dk.id, sid: dk.sid, name: dk.name, desc: dk.type === 'g' ? 'Pick the right article' : dk.type ? 'Pick the right translation' : dk.desc, n: deckIds(dk).length }));
  for (const x of RG.subjects) out.push(...paperGroups(x));

}
// { ids: cards to ask, pool: cards to draw wrong answers from, name, sid, kind }
function findQuiz(id) {

    const on = el.getAttribute('aria-pressed') !== 'true'; sess.checks[el.dataset.chk] = on; el.setAttribute('aria-pressed', on);
    if (on) { Sound.tick(); buzz(8); }
    const cnt = $('#counter'); if (cnt) cnt.textContent = Object.values(sess.checks).filter(Boolean).length + ' / ' + TOPIC[sess.b.t].pts.length;
    return;
  }
  if (el.dataset.weak) { const on = el.getAttribute('aria-pressed') !== 'true'; sess.checks[el.dataset.weak] = on; el.setAttribute('aria-pressed', on); if (on) Sound.tick(); return; }
  const a = el.dataset.act;
  switch (a) {
    case 'tick': {
      const d = el.dataset.d, it = dayPlan(d).items.find((x) => x.id === el.dataset.id); if (!it) break;
      const on = it.done == null;
      markItem(d, it, on ? 1 : null);
      if (on) { addXP(5); Sound.tick(); }
      save(); render();
      if (on) xpFloat(5, $(`[data-act="tick"][data-id="${it.id}"]`));
      break;
    }
    case 'start': openSession({ date: el.dataset.d, id: el.dataset.id }); break;
    case 'revise': openSession({ t: el.dataset.t }); break;
    case 'review': startCards('review', el.dataset.id ? { date: el.dataset.d, id: el.dataset.id } : undefined); break;
    case 'rebuild': rebuildPlan(el.dataset.d); save(); render(); toast('Topics re-picked from your latest ratings'); break;
    case 'nolive': {
      const d = el.dataset.d;
      if (state.noLive[d]) delete state.noLive[d]; else state.noLive[d] = true;
      save(); render(); toast(state.noLive[d] ? 'Live lessons swapped for self-study' : 'Live lessons are back on');
      break;
    }
    case 'close': requestClose(); break;
    case 'stay': if (sess && sess.steps) renderSession(); break;
    case 'leave': closeSession(); break;
    case 'timer':
      if (!sess) break;
      if (sess.left === 0) sess.left = sess.b.m * 60;
      sess.running = !sess.running;
      clearInterval(timerInt); timerInt = sess.running ? setInterval(tick, 1000) : null;
      el.classList.toggle('on', sess.running); break;
    case 'next': {
      if (sess.complete) { closeSession(); break; }
      if (sess.deck) { markDeckDone(); closeSession(); break; }
      const step = sess.steps[sess.step];
      if (step === 'score') { sess.score = ($('#p-score') || {}).value || ''; sess.max = ($('#p-max') || {}).value || ''; finishSession(); break; }
      if (step === 'rate') { if (sess.rating) finishSession(); break; }
      sess.step++; renderSession(); break;
    }
    case 'pick': {
      sess.rating = Number(el.dataset.r); Sound.tick();
      $$('#session .choice.rate').forEach((b) => b.setAttribute('aria-pressed', b === el ? 'true' : 'false'));
      const nr = $('#next-review'); if (nr) nr.innerHTML = nextReviewTxt(TOPIC[sess.b.t], sess.rating);
      const btn = $('#l-foot .btn'); if (btn) btn.disabled = false;
      break;
    }
    case 'flip': flipCard(); break;
    case 'grade': gradeCurrent(el.dataset.ok === '1'); break;
    case 'cont': continueCard(); break;
    case 'cram': startCards('cram'); break;
    case 'practice': startPractice(el.dataset.deck); break;
    case 'quiz': startQuiz(el.dataset.src); break;
    case 'qpick': pickQuiz(Number(el.dataset.i)); break;
    case 'qnext': nextQuiz(); break;
    case 'qagain': { const id = sess && sess.quiz && sess.quiz.src; closeSession(false, true); if (id) startQuiz(id); break; }
    case 'check': checkTyped(($('#ans') || {}).value || ''); break;
    case 'idk': checkTyped('', true); break;
    case 'gpick': checkTyped(el.dataset.g); break;
    case 'override': overrideRight(); break;
    case 'uml': {
      const i = $('#ans'); if (!i || i.readOnly) break;
      const a0 = i.selectionStart == null ? i.value.length : i.selectionStart, b0 = i.selectionEnd == null ? a0 : i.selectionEnd;
      i.value = i.value.slice(0, a0) + el.dataset.ch + i.value.slice(b0); i.focus(); i.setSelectionRange(a0 + 1, a0 + 1); break;
    }
    case 'again': { const id = sess && sess.pdeck; closeSession(false, true); if (id) startPractice(id); break; }
    case 'export': {
      const txt = JSON.stringify(state), ta = $('#backup'); ta.value = txt;
      try { navigator.clipboard.writeText(txt).then(() => toast('Backup copied'), () => { ta.select(); toast('Select all and copy the box'); }); } catch (err) { ta.select(); toast('Select all and copy the box'); }
      break;
    }
    case 'import': {
      try { const obj = JSON.parse($('#backup').value); if (!obj || !obj.settings) throw new Error('bad'); state = migrate(obj); applySettings(); applyTheme(); save(); render(); toast('Progress restored'); }
      catch (err) { toast('That doesn\'t look like a backup. Paste the whole text'); }
      break;
    }
    case 'reset': $('#reset-confirm').innerHTML = '<button class="btn" data-variant="destructive" data-size="sm" data-act="reset-yes">Yes, delete everything</button>'; break;
    case 'reset-yes': { const keep = state.settings; state = defaultState(); state.settings = keep; save(); render(); toast('Progress reset'); break; }
    case 'login-signup': authDo('signup'); break;
    case 'login-google': authDo('google'); break;
    case 'login-reset': authDo('reset'); break;
    case 'login-skip': setSkipLogin(true); go('today'); break;
    case 'signin-now': setSkipLogin(false); render(); window.scrollTo(0, 0); break;
    case 'signout': authSignOut(); break;
  }
});
document.addEventListener('submit', (e) => {
  if (e.target && e.target.id === 'login-form') { e.preventDefault(); authDo('signin'); }
  if (e.target && e.target.id === 'pw-form') { e.preventDefault(); addPassword(); }
  if (e.target && e.target.id === 'type-form') { e.preventDefault(); if (sess && sess.fb) continueCard(); else checkTyped(($('#ans') || {}).value || ''); }
});
// keep the keyboard up when tapping the umlaut / Check buttons
document.addEventListener('mousedown', (e) => { if (e.target.closest && e.target.closest('[data-act="uml"],[data-act="check"]')) e.preventDefault(); });
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.themePick != null) { state.settings.theme = el.value; applyTheme(); save(); return; }
  if (el.dataset.typemode != null) { state.settings.typeMode = el.checked; save(); render(); return; }
  if (el.dataset.sound != null) { state.settings.sound = el.checked; save(); if (el.checked) Sound.correct(); return; }
  if (el.dataset.tick) { const t = state.ticks[el.dataset.tick] || (state.ticks[el.dataset.tick] = {}); t[el.dataset.i] = el.checked; save(); render(); return; }
  if (el.dataset.tier) { state.settings.tiers[el.dataset.tier] = el.value; afterSettings(); }
  else if (el.dataset.mock != null) { const m = state.settings.mocks[Number(el.dataset.mock)]; if (el.value) m[el.dataset.f] = el.value; if (m.end < m.start) m.end = m.start; afterSettings(); }
  else if (el.dataset.speaking != null) { if (el.value) state.settings.speakingDate = el.value; applySettings(); afterSettings(); }
  else if (el.dataset.hol != null) {
    const L = holidayList().map((x) => x.slice()), row = L[Number(el.dataset.hol)];
    if (el.value) row[Number(el.dataset.f)] = el.value;
    if (row[1] < row[0]) row[1] = row[0];
    state.settings.holidays = L; afterSettings();
  }
});
function afterSettings() { rebuildPlan(D.today()); save(); toast('Plan updated'); render(); }
document.addEventListener('keydown', (e) => {
  if (!sess) return;
  if (e.key === 'Escape') { requestClose(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName)) return;
  if (sess.quiz && !sess.complete) {
    if (!sess.fb && /^[1-4]$/.test(e.key)) pickQuiz(Number(e.key) - 1);
    else if (sess.fb && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); nextQuiz(); }
    return;
  }
  const q = (sess.deck || (sess.steps && sess.steps[sess.step] === 'cards')) ? queue() : null;
  if (q && q.i < q.list.length) {
    if (sess.fb) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); continueCard(); } return; }
    if (sess.typing) { if (sess.ptype === 'g' && /^[123]$/.test(e.key)) checkTyped(['der', 'die', 'das'][e.key - 1]); return; }
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!q.flip) flipCard(); return; }
    if (q.flip && e.key === '1') gradeCurrent(false);
    if (q.flip && e.key === '2') gradeCurrent(true);
    return;
  }
  if (e.key === 'Enter') { const b = $('#l-foot .btn'); if (b && !b.disabled) b.click(); }
});
window.addEventListener('hashchange', () => {
  parseHash(); noteHash();
  if (sess) { sessPushed = false; closeSession(true); }
  render.scrolled = false; window.scrollTo(0, 0); render();
});

/* ---------- boot ---------- */
// once a minute: keep the Now card current without collapsing anything you've opened
function refreshNow() {
  if (R.tab !== 'today' || R.parts[0] || sess) return;
  const day = dayPlan(D.today()), t = new Date(), mins = t.getHours() * 60 + t.getMinutes(), pos = nowIn(day, mins);
  const key = (pos.cur && pos.cur.id) + '|' + (pos.next && pos.next.id);
  if (key !== refreshNow.key) { refreshNow.key = key; render(); return; }
  const el = $('#view .now'); if (el) el.outerHTML = nowCard(day, pos, mins);
}
function boot() {
  if (typeof state.xp !== 'number') state.xp = 0;
  applyTheme();
  if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyTheme); }
  $('#nav').innerHTML = '<div class="nav-in">' + TABS.map(([r, l, i]) => `<a href="#/${r}" data-r="${r}">${ic(i)}<span>${l}</span></a>`).join('') + '</div>';
  parseHash(); noteHash(); render();
  initClaudeCloud();
  initFirebaseAuth();
  window.addEventListener('rgauth-ready', () => { initFirebaseAuth(); render(); });
  let day = D.today();
  setInterval(() => { if (sess) return; if (D.today() !== day) { day = D.today(); render(); } else refreshNow(); }, 60000);
}
boot();

</script>

<script type="module">
// Firebase sign-in + per-user progress document (GitHub Pages build only).
// Loads only when docs/firebase-config.js sets window.FIREBASE_CONFIG.
const cfg = window.FIREBASE_CONFIG;
if (cfg && cfg.apiKey) {
  const V = '10.12.2';
  const [{ initializeApp }, A, F] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  window.RGAuth = {
    signIn: (email, pass) => A.signInWithEmailAndPassword(auth, email, pass),
    signUp: (email, pass) => A.createUserWithEmailAndPassword(auth, email, pass),
    google: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    reset: (email) => A.sendPasswordResetEmail(auth, email),
    signOut: () => A.signOut(auth),
    // sign-in methods on the current account, e.g. ['google.com'] or ['google.com', 'password']
    providers: () => (auth.currentUser ? auth.currentUser.providerData.map((p) => p.providerId) : []),
    // add an email + password to an account made with Google, so it can sign in anywhere
    addPassword: async (pass) => {
      const u = auth.currentUser;
      const cred = A.EmailAuthProvider.credential(u.email, pass);
      try { return await A.linkWithCredential(u, cred); }
      catch (e) {
        if (e && e.code === 'auth/requires-recent-login') {
          await A.reauthenticateWithPopup(u, new A.GoogleAuthProvider());
          return A.linkWithCredential(u, cred);
        }
        throw e;
      }
    },
    onChange: (cb) => A.onAuthStateChanged(auth, cb),
    // One document per user: users/{uid} = { s: <progress JSON>, at: <last edit time> }
    backend: (uid) => {
      const ref = F.doc(db, 'users', uid);
      return {
        uid,
        load: async () => { const snap = await F.getDoc(ref); return snap.exists() ? snap.data() : null; },
        save: (data) => F.setDoc(ref, data),
        watch: (cb, err) => F.onSnapshot(ref, (snap) => { if (snap.exists() && !snap.metadata.hasPendingWrites) cb(snap.data()); }, err),
      };
    },
  };
  window.dispatchEvent(new Event('rgauth-ready'));
}
</script>
