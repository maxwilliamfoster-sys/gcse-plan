<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Max's GCSE Plan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GCSE Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#16203A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#F3F4F0; --card:#FFFFFF; --card-2:#F8F9F6; --ink:#16203A; --ink-2:#48536B; --ink-3:#7A8397;
  --line:#DCE0E5; --line-2:#EBEEF1; --btn:#16203A; --btn-ink:#FFFFFF; --focus:#2447B3; --link:#2447B3;
  --hi:#F3DE45; --hi-soft:#FBF3B8; --hi-ink:#3B3300;
  --c1:#D64545; --c2:#E07B39; --c3:#CFA500; --c4:#5FA846; --c5:#23935A; --c0:#B8BEC9;
  --maths:#5B5BD6; --science:#1F9D6B; --englang:#D1435B; --englit:#A8326E; --geog:#0E8FA6; --hist:#9A6B2E; --german:#C98F00;
  --shadow:0 1px 2px rgba(22,32,58,.06),0 4px 14px rgba(22,32,58,.06);
  --r:14px; --r-sm:9px;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0D1220; --card:#161C2C; --card-2:#1B2234; --ink:#E9ECF3; --ink-2:#AEB6C8; --ink-3:#7F889C;
    --line:#2A3246; --line-2:#222A3C; --btn:#E9ECF3; --btn-ink:#0D1220; --focus:#8EA6FF; --link:#9DB2FF;
    --hi:#E8CF2E; --hi-soft:#3A3413; --hi-ink:#FFF3A6;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --maths:#8C8CFF; --science:#3CC48E; --englang:#F0667D; --englit:#D9609F; --geog:#2EC0D6; --hist:#CD9A58; --german:#E8B52A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0D1220; --card:#161C2C; --card-2:#1B2234; --ink:#E9ECF3; --ink-2:#AEB6C8; --ink-3:#7F889C;
  --line:#2A3246; --line-2:#222A3C; --btn:#E9ECF3; --btn-ink:#0D1220; --focus:#8EA6FF; --link:#9DB2FF;
  --hi:#E8CF2E; --hi-soft:#3A3413; --hi-ink:#FFF3A6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --maths:#8C8CFF; --science:#3CC48E; --englang:#F0667D; --englit:#D9609F; --geog:#2EC0D6; --hist:#CD9A58; --german:#E8B52A;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font:700 18px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font:500 11px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.count{margin-left:auto;font:600 12px/1 var(--f-mono);background:var(--hi);color:#2A2400;padding:6px 9px;border-radius:999px;white-space:nowrap}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;text-decoration:none;color:var(--ink-3);font:600 11px/1 var(--f-body)}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"] svg{stroke:var(--ink)}

/* type */
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.1;font-weight:700}
h2{font-size:20px;line-height:1.2;font-weight:700}
h3{font-size:16px;line-height:1.3;font-weight:650}
.eyebrow{font:600 11px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
p{margin:0}

/* layout blocks */
.stack{display:flex;flex-direction:column;gap:12px}
.sect{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.flat{background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--r);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.wrap-row{display:flex;flex-wrap:wrap;gap:8px}

/* hero */
.hero{padding-top:20px;display:flex;flex-direction:column;gap:10px}
.hero .date{font:600 13px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase}
.phase{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.phase b{color:var(--ink)}
.meter{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .4s}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);padding:6px 9px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.hi{background:var(--hi-soft);border-color:transparent;color:var(--hi-ink)}
.chip.ink{background:var(--ink);color:var(--ground);border-color:transparent}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c0)}
.tag{font:600 11px/1 var(--f-mono);letter-spacing:.03em;padding:4px 6px;border-radius:6px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-2)}

/* session list */
.blocks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.block{display:grid;grid-template-columns:6px 1fr auto;gap:0 12px;align-items:center;padding:13px 14px 13px 0;border-top:1px solid var(--line-2);position:relative}
.block:first-child{border-top:0}
.block .bar{align-self:stretch;border-radius:0 4px 4px 0}
.block .t{font-weight:700;line-height:1.3}
.block .m{font-size:13px;color:var(--ink-2);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.block.done .t{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-2)}
.block .why{font-size:12px;color:var(--ink-3);margin-top:4px}
.go{appearance:none;border:0;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.go:hover{filter:brightness(1.1)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--card-2)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.btn.small{font-size:13px;padding:7px 11px}
.btn[disabled]{opacity:.45;cursor:default}
.linkbtn{appearance:none;border:0;background:none;color:var(--link);font-weight:700;padding:0;cursor:pointer;font-size:14px}
.done-badge{font:700 12px/1 var(--f-mono);padding:7px 9px;border-radius:999px;color:#fff}

/* alerts */
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r);background:var(--hi-soft);color:var(--hi-ink)}
.alert b{color:inherit}
.alert.plain{background:var(--card-2);color:var(--ink);border:1px solid var(--line)}

/* next exam */
.nextx{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.big-n{font:700 44px/0.9 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big-n small{display:block;font:600 11px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}

/* seg control */
.seg{display:flex;gap:4px;padding:4px;background:var(--card-2);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{appearance:none;border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* forecast */
.day{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.day-h b{font-family:var(--f-display);font-size:16px}
.fl{display:flex;align-items:center;gap:8px;font-size:14px;line-height:1.35}
.fl .k{font:600 11px/1 var(--f-mono);color:var(--ink-3);min-width:62px}

/* roadmap */
.road{position:relative;display:flex;flex-direction:column;gap:0}
.stage{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:18px;position:relative}
.stage:before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.stage:last-child:before{display:none}
.stage .pin{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--card);margin-top:2px;position:relative;z-index:1}
.stage.past .pin{background:var(--ink-3);border-color:var(--ink-3)}
.stage.now .pin{background:var(--hi);border-color:var(--ink);box-shadow:0 0 0 4px var(--hi-soft)}
.stage .when{font:600 12px/1.3 var(--f-mono);color:var(--ink-3)}
.stage ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:14px}

/* exam table */
.xt{width:100%;border-collapse:collapse;font-size:14px}
.xt td{padding:10px 8px;border-top:1px solid var(--line-2);vertical-align:top}
.xt tr:first-child td{border-top:0}
.xt .d{font-family:var(--f-mono);white-space:nowrap;font-size:13px}
.xt .n{font-family:var(--f-mono);text-align:right;white-space:nowrap;color:var(--ink-3);font-size:13px}
.xt tr.next td{background:var(--hi-soft)}
.xt tr.gone td{opacity:.45}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}

/* subjects */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.scard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border-top:5px solid var(--sc)}
.scard:hover{border-color:var(--ink-3);border-top-color:var(--sc)}
.conf-strip{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line-2)}
.conf-strip i{display:block;height:100%}
.trow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line-2)}
.trow:first-child{border-top:0}
.trow button.tn{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:700;color:var(--ink);line-height:1.3}
.rate5{display:flex;gap:4px}
.rate5 button{appearance:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);font:700 13px/1 var(--f-mono);color:var(--ink-3);cursor:pointer;padding:0}
.rate5 button[aria-pressed="true"]{color:#fff;border-color:transparent}
.rate5 button[data-r="1"][aria-pressed="true"]{background:var(--c1)}
.rate5 button[data-r="2"][aria-pressed="true"]{background:var(--c2)}
.rate5 button[data-r="3"][aria-pressed="true"]{background:var(--c3)}
.rate5 button[data-r="4"][aria-pressed="true"]{background:var(--c4)}
.rate5 button[data-r="5"][aria-pressed="true"]{background:var(--c5)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;color:var(--ink-2);font-size:14px;padding-top:16px}
ul.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ul.pts li::marker{color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* flashcards */
.fc{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:26px 20px;cursor:pointer;user-select:none;-webkit-user-select:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative}
.fc .q{font:650 22px/1.3 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.fc .a{font-size:18px;line-height:1.45;color:var(--ink);border-top:1px dashed var(--line);padding-top:14px;width:100%}
.fc .hint{font-size:13px;color:var(--ink-3)}
.fc .src{position:absolute;top:12px;left:14px;font:600 11px/1 var(--f-mono);color:var(--ink-3);text-align:left}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade button{padding:14px;border-radius:var(--r-sm);font-weight:700;font-size:15px;cursor:pointer;border:1px solid var(--line);background:var(--card)}
.grade .no{color:var(--c1)}
.grade .yes{background:var(--btn);color:var(--btn-ink);border-color:transparent}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.boxes div{background:var(--card-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 4px}
.boxes b{display:block;font:700 18px/1.1 var(--f-display)}
.boxes span{font:600 10px/1 var(--f-mono);color:var(--ink-3)}

/* session overlay */
.sess{position:fixed;inset:0;z-index:20;background:var(--ground);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sess-in{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;gap:16px}
.sess-top{display:flex;align-items:center;gap:10px}
.x{appearance:none;border:1px solid var(--line);background:var(--card);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;flex:none}
.timer{margin-left:auto;display:flex;align-items:center;gap:8px}
.timer .clock{font:600 20px/1 var(--f-mono);font-variant-numeric:tabular-nums;min-width:66px;text-align:right}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--ink)}
.steps i.done{background:var(--ink-3)}
.step-card{display:flex;flex-direction:column;gap:14px}
.checkl{display:flex;flex-direction:column;gap:8px}
.checkl label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);cursor:pointer;line-height:1.45}
.checkl input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--c5)}
.rate-big{display:flex;flex-direction:column;gap:8px}
.rate-big button{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);cursor:pointer}
.rate-big button b{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:#fff;font:700 15px/1 var(--f-mono)}
.rate-big button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:0}
.sess-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);padding:10px;font:13px/1.4 var(--f-mono)}
input[type=date],input[type=number],select{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);padding:8px 10px;min-height:40px}
.field{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2)}
.field:first-child{border-top:0}
.field .l{font-weight:700}
.field .s{font-size:13px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--c0)}
.sync.ok i{background:var(--c5)}
.sync.warn i{background:var(--c2)}
details.why{font-size:14px;color:var(--ink-2)}
details.why summary{cursor:pointer;font-weight:700;color:var(--ink)}
details.why ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.empty{padding:26px 16px;text-align:center;color:var(--ink-2)}
@media (min-width:640px){
  h1{font-size:34px}
  .hero{padding-top:28px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">GCSE Plan <small>Summer 2027</small></div><span class="count" id="count" aria-live="polite"></span></div></header>
<main class="wrap" id="view"></main>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div class="sess" id="session" hidden role="dialog" aria-modal="true" aria-label="Revision session"></div>
<script>
const RG = { subjects: [] };
/* Maths — Pearson Edexcel GCSE Mathematics 1MA1 (Chesterton exams page) */
RG.subjects.push({
  id: 'maths', name: 'Maths', board: 'Edexcel', spec: '1MA1', quals: 1, share: 0.20,
  tierable: true,
  link: 'https://qualifications.pearson.com/en/qualifications/edexcel-gcses/mathematics-2015.html',
  papers: [
    { id: 'm1', code: '1MA1/1', name: 'Paper 1 · Non-calculator', date: '2027-05-14', time: 'am', dur: 90 },
    { id: 'm2', code: '1MA1/2', name: 'Paper 2 · Calculator', date: '2027-05-27', time: 'am', dur: 90 },
    { id: 'm3', code: '1MA1/3', name: 'Paper 3 · Calculator', date: '2027-06-14', time: 'am', dur: 90 }
  ],
  structure: [
    'Three papers, 1h 30m each, 80 marks each, equal weighting. Paper 1 has no calculator.',
    'Foundation (grades 1–5) or Higher (grades 4–9) — set your tier in Settings.',
    'Any topic can come up on any paper, so every topic is revised for all three.'
  ],
  technique: [
    'About 1 mark per minute. Circle the marks for each question and budget time.',
    'Always show working: most marks are method marks, even when the final answer is wrong.',
    'Underline the instruction: units, decimal places, "give reasons", "show that".',
    'Check your calculator is in Degrees (D) before any trig question.',
    'Non-calc: practise written multiplication, division and fraction arithmetic until automatic.',
    'Stuck? Write down anything you know (a formula, a labelled diagram). Then move on and come back.'
  ],
  resources: [
    ['Corbettmaths 5-a-day (daily practice)', 'https://corbettmaths.com/5-a-day/gcse/'],
    ['Physics & Maths Tutor (questions by topic)', 'https://www.physicsandmathstutor.com/'],
    ['Edexcel 1MA1 specification & past papers', 'https://qualifications.pearson.com/en/qualifications/edexcel-gcses/mathematics-2015.html']

      cards: [['Define osmosis', 'Diffusion of water from a dilute to a more concentrated solution through a partially permeable membrane'],
        ['Why does active transport need energy?', 'It moves substances against the concentration gradient; energy comes from respiration'],
        ['Why use % change in mass in the osmosis practical?', 'Cylinders start with different masses, so % allows a fair comparison'],
        ['Adaptations of alveoli', 'Large surface area, thin walls, rich blood supply, ventilation']],
      ex: 'Do a past-paper osmosis practical question including a graph and finding where the line crosses zero.' },
    { id: 'b-digest', n: 'Digestion & enzymes', p: ['sb1'], w: 3,
      pts: ['Enzymes are biological catalysts. Lock and key: the substrate fits the active site.',
        'High temperature or wrong pH changes the active site shape — the enzyme is denatured.',
        'Carbohydrase (amylase) → starch to sugars. Protease → proteins to amino acids. Lipase → lipids to fatty acids + glycerol.',
        'Bile is made in the liver and stored in the gall bladder. It neutralises stomach acid and emulsifies fat (bigger surface area).',
        'Food tests: Benedict\'s (heat) blue → brick red for sugar. Iodine orange → blue-black for starch. Biuret blue → purple for protein. Ethanol → cloudy white for lipids.',
        'Required practical: effect of pH on amylase. Time how long until iodine stops turning blue-black.'],
      cards: [['What does protease produce?', 'Amino acids'], ['Products of lipase', 'Fatty acids and glycerol'], ['Two roles of bile', 'Neutralises stomach acid; emulsifies fats'],
        ['Test and positive result for protein', 'Biuret: blue → purple'], ['Test for starch', 'Iodine: orange-brown → blue-black'], ['Why does a denatured enzyme stop working?', 'Its active site changes shape, so the substrate no longer fits']],
      ex: 'Write the method for the amylase practical from memory (with the control variables), then check a mark scheme.' },
    { id: 'b-heart', n: 'Heart, blood & lungs', p: ['sb1'], w: 3,
      pts: ['Double circulatory system: right side pumps blood to the lungs, left side pumps it to the body.',
        'Route: vena cava → right atrium → right ventricle → pulmonary artery → lungs → pulmonary vein → left atrium → left ventricle → aorta.',
        'Pacemaker cells in the right atrium set the heart rate. Artificial pacemakers fix irregular rhythms.',
        'Arteries: thick muscular, elastic walls (high pressure). Veins: valves and a large lumen. Capillaries: walls one cell thick for exchange.',
        'Blood: red cells (haemoglobin, no nucleus, biconcave), white cells (defence), platelets (clotting), plasma (transports everything).',
        'Coronary heart disease: fatty deposits narrow the coronary arteries. Treatments: stents, statins, transplants, replacement valves.'],
      cards: [['Which side of the heart pumps to the lungs?', 'Right'], ['Why do arteries have thick walls?', 'To withstand high pressure'],
        ['Why are capillary walls one cell thick?', 'Short diffusion distance'], ['Role of platelets', 'Help the blood clot'],
        ['Advantage and disadvantage of statins', 'Lower blood cholesterol / must be taken long-term and have side effects']],
      ex: 'Trace a drop of blood through the heart aloud, then answer a 6-marker comparing stents and statins.' },
    { id: 'b-disease', n: 'Non-communicable disease & plants', p: ['sb1'], w: 2,
      pts: ['Health is physical and mental wellbeing. Risk factors: smoking (lung disease, cancer), obesity (Type 2 diabetes), alcohol (liver, brain), carcinogens and radiation (cancer).',
        'Benign tumours stay in one place. Malignant tumours invade tissue and spread in the blood (secondary tumours).',
        'Plant tissues: epidermis, palisade mesophyll (photosynthesis), spongy mesophyll (air spaces), xylem, phloem, meristem.',
        'Xylem carries water and minerals up (transpiration stream). Phloem carries dissolved sugars both ways (translocation).',
        'Stomata, opened and closed by guard cells, control gas exchange and water loss.',
        'Transpiration is faster when it is warmer, drier, windier and brighter.'],
      cards: [['Difference between benign and malignant tumours', 'Malignant tumours invade tissue and spread via the blood'], ['What does phloem transport?', 'Dissolved sugars (translocation)'],
        ['Four factors that increase transpiration', 'Temperature, light intensity, air movement, lower humidity'], ['What controls stomata?', 'Guard cells']],
      ex: 'Answer an exam question interpreting data on a risk factor (correlation vs causation) and one on transpiration.' },
    { id: 'b-infection', n: 'Infection & response', p: ['sb1'], w: 3,
      pts: ['Pathogens: viruses (measles, HIV, tobacco mosaic virus), bacteria (Salmonella, gonorrhoea), fungi (rose black spot), protists (malaria — spread by mosquitoes).',
        'Spread by air, water or direct contact. Reduce by hygiene, isolation, destroying vectors, vaccination.',
        'Non-specific defences: skin, nose hairs and mucus, cilia in the trachea, stomach acid.',
        'White blood cells: phagocytosis, producing antibodies, producing antitoxins.',
        'Vaccination: dead or inactive pathogen → white cells make antibodies and memory cells → fast response later. Herd immunity protects others.',
        'Antibiotics kill bacteria but NOT viruses. Resistance is increasing. Drug testing: pre-clinical (cells, animals) → clinical trials, double-blind with a placebo.'],
      cards: [['Why can\'t antibiotics treat viral infections?', 'Viruses live inside cells; antibiotics only kill bacteria'], ['Three ways white blood cells defend us', 'Phagocytosis, antibodies, antitoxins'],
        ['What is a double-blind trial?', 'Neither patients nor doctors know who gets the drug or the placebo'], ['How is malaria spread?', 'By mosquitoes (vector), protist pathogen'],
        ['How does vaccination work?', 'Inactive pathogen triggers antibodies and memory cells, so a later infection is fought quickly']],
      ex: 'Make a table of the 8 named diseases (pathogen type, spread, symptoms, control), then do one 6-marker on vaccination.' },
    { id: 'b-energy', n: 'Photosynthesis & respiration', p: ['sb1'], w: 3,
      pts: ['Photosynthesis: carbon dioxide + water → glucose + oxygen (light, chlorophyll). 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. Endothermic.',
        'Limiting factors: light intensity, CO₂ concentration, temperature, amount of chlorophyll.',
        'Inverse square law (H): light intensity ∝ 1/distance².',
        'Glucose is used for respiration, starch (storage), cellulose, fats/oils, and amino acids (with nitrate ions).',
        'Aerobic respiration: glucose + oxygen → carbon dioxide + water. Anaerobic in muscles: glucose → lactic acid (oxygen debt, H). In yeast: glucose → ethanol + carbon dioxide.',
        'Required practical: pondweed at different distances from a lamp — count bubbles or measure O₂ volume.'],
      cards: [['Word equation for photosynthesis', 'Carbon dioxide + water → glucose + oxygen'], ['Word equation for aerobic respiration', 'Glucose + oxygen → carbon dioxide + water'],
        ['Anaerobic respiration in muscles produces…', 'Lactic acid'], ['Anaerobic respiration in yeast produces…', 'Ethanol and carbon dioxide'],
        ['Four limiting factors of photosynthesis', 'Light intensity, CO₂ concentration, temperature, chlorophyll'], ['Why does a graph of rate vs light intensity level off?', 'Another factor (CO₂ or temperature) becomes limiting']],
      ex: 'Do a limiting-factor graph question and a 6-marker describing the pondweed practical.' },

    /* ---------- BIOLOGY PAPER 2 ---------- */
    { id: 'b-nerves', n: 'Nervous system & reaction time', p: ['sb2'], w: 2, from: '2027-01-04',
      pts: ['Stimulus → receptor → sensory neurone → relay neurone (CNS) → motor neurone → effector → response.',
        'Reflexes are automatic and rapid, and they do not involve the conscious brain. Synapses pass signals chemically across a gap.',
        'The CNS is the brain and spinal cord.',
        'Required practical: ruler-drop reaction time. Repeat, calculate the mean, control the hand and the distractions.'],
      cards: [['Order of a reflex arc', 'Receptor → sensory → relay → motor → effector'], ['How is a signal passed across a synapse?', 'Chemicals diffuse across the gap'],
        ['Why are reflexes fast?', 'They bypass the conscious part of the brain']],
      ex: 'Label a reflex arc from memory and answer a reaction-time practical question.' },
    { id: 'b-hormones', n: 'Hormones, blood glucose & reproduction', p: ['sb2'], w: 3, from: '2027-01-04',
      pts: ['Endocrine glands release hormones into the blood. The pituitary is the "master gland".',
        'Blood glucose too high → pancreas releases insulin → cells take up glucose, liver stores it as glycogen. Too low → glucagon (H) converts glycogen back.',
        'Type 1 diabetes: the pancreas makes no insulin → injections. Type 2: cells stop responding → diet and exercise. Obesity is a risk factor.',
        'Menstrual cycle: FSH (egg matures, oestrogen made), oestrogen (lining builds), LH (ovulation), progesterone (maintains lining).',
        'Contraception: hormonal (pill, implant, injection) and non-hormonal (condoms, diaphragm, IUD, sterilisation, abstinence).',
        'H: thyroxine and adrenaline, negative feedback, and using hormones to treat infertility (IVF).'],
      cards: [['Hormone that lowers blood glucose', 'Insulin'], ['Difference between Type 1 and Type 2 diabetes', 'Type 1: no insulin made. Type 2: cells don\'t respond to insulin'],
        ['Which hormone triggers ovulation?', 'LH'], ['Role of FSH', 'Causes an egg to mature and stimulates oestrogen production'], ['Where is glycogen stored?', 'Liver (and muscles)']],
      ex: 'Draw the blood-glucose feedback loop, then do a 6-marker comparing hormonal and non-hormonal contraception.' },
    { id: 'b-genetics', n: 'Inheritance & variation', p: ['sb2'], w: 3,
      pts: ['DNA is a double helix polymer. A gene codes for a particular protein. The genome is all of an organism\'s genetic material.',
        'Meiosis makes 4 genetically different gametes with half the chromosomes. Fertilisation restores the full number.',
        'Dominant allele shows with one copy. Recessive needs two. Homozygous = same alleles, heterozygous = different.',
        'Punnett squares give probabilities. Cystic fibrosis is recessive. Polydactyly is dominant.',
        'Sex: XX female, XY male — always a 50% chance of either.',
        'Embryo screening raises ethical, economic and social issues.'],
      cards: [['Define allele', 'A different form of the same gene'], ['Genotype vs phenotype', 'Genotype = alleles; phenotype = characteristic shown'],
        ['Two carriers (Ff × Ff) of cystic fibrosis: chance of an affected child?', '25% (1 in 4)'], ['How many cells does meiosis produce?', 'Four genetically different gametes'],
        ['Is polydactyly dominant or recessive?', 'Dominant']],
      ex: 'Do 3 Punnett-square questions (including a family tree) and one embryo-screening evaluation.' },
    { id: 'b-evolution', n: 'Evolution, breeding & classification', p: ['sb2'], w: 2,
      pts: ['Natural selection: variation → better-adapted individuals survive and breed → pass on alleles → over time the species changes.',
        'Evidence: fossils, antibiotic-resistant bacteria.',
        'Selective breeding: choose parents with desired traits over many generations. Risk: inbreeding and reduced variation.',
        'Genetic engineering: a gene is transferred into another organism (e.g. human insulin gene into bacteria, GM crops).',
        'Classification: Linnaean system (kingdom … species, binomial names). Woese\'s three domains: Archaea, Bacteria, Eukaryota.',
        'Extinction causes: new predators, disease, competition, environmental change, catastrophic events.'],
      cards: [['Why are antibiotic-resistant bacteria evidence for evolution?', 'Resistant bacteria survive and reproduce, so resistance spreads — natural selection seen quickly'],
        ['One risk of selective breeding', 'Inbreeding — reduced variation, vulnerable to disease'], ['Woese\'s three domains', 'Archaea, Bacteria, Eukaryota'],
        ['Example of genetic engineering', 'Human insulin gene put into bacteria']],
      ex: 'Write a 6-mark explanation of how antibiotic resistance develops (natural selection steps in order).' },
    { id: 'b-ecology', n: 'Ecology & biodiversity', p: ['sb2'], w: 3, from: '2026-09-02',
      pts: ['Community = all populations in a habitat. Interdependence: species depend on each other for food, shelter, pollination.',
        'Abiotic factors: light, temperature, moisture, soil pH and minerals, wind, CO₂, O₂. Biotic: food, predators, pathogens, competition.',
        'Adaptations: structural, behavioural, functional. Extremophiles live in extreme conditions.',
        'Predator–prey cycles: predator numbers peak after prey numbers.',
        'Required practical: quadrats (random sampling for abundance) and transects (how distribution changes).',
        'Carbon cycle: photosynthesis removes CO₂; respiration, decomposition and combustion return it. Water cycle: evaporation, condensation, precipitation.',
        'Humans reduce biodiversity through waste, pollution, land use, deforestation (peat bogs, tropical forest) and global warming. Protect it with breeding programmes, hedgerows, reduced deforestation and recycling.'],
      cards: [['Three abiotic factors', 'e.g. light intensity, temperature, soil pH'], ['What is a quadrat used for?', 'Estimating population size / abundance by random sampling'],
        ['What is a transect used for?', 'Showing how distribution changes across a habitat'], ['Two processes that return CO₂ to the air', 'Respiration and combustion (also decomposition)'],
        ['Why does the predator peak come after the prey peak?', 'Predators need time to feed and reproduce after food increases']],
      ex: 'Do a quadrat calculation (mean per quadrat × area) and a 6-marker on the carbon cycle.' },

    /* ---------- CHEMISTRY PAPER 1 ---------- */
    { id: 'c-atoms', n: 'Atoms, the periodic table & separating', p: ['sc1'], w: 3,
      pts: ['Proton: charge +1, mass 1. Neutron: 0, mass 1. Electron: −1, very small mass. Atomic number = protons. Mass number = protons + neutrons.',
        'Isotopes: same number of protons, different number of neutrons.',
        'Model of the atom: Dalton (solid spheres) → Thomson plum pudding (electron discovered) → Rutherford alpha scattering (nucleus) → Bohr (electron shells) → Chadwick (neutron).',
        'Electron shells: 2, 8, 8. Group number = outer electrons. Period = number of shells.',
        'Group 1: react with water → metal hydroxide + hydrogen, more reactive down the group. Group 7: less reactive down the group, displacement reactions. Group 0: unreactive (full outer shell).',
        'Separating mixtures: filtration, crystallisation, simple and fractional distillation, chromatography. Mendeleev left gaps for undiscovered elements.'],
      cards: [['Define isotope', 'Atoms of the same element with different numbers of neutrons'], ['What did the alpha-scattering experiment show?', 'Mass is concentrated in a small, positive nucleus'],
        ['Electronic structure of sodium (11)', '2, 8, 1'], ['Why does Group 1 reactivity increase down the group?', 'Outer electron is further from the nucleus, so it is lost more easily'],
        ['Why did Mendeleev leave gaps?', 'For elements not yet discovered, so patterns lined up'], ['Group 1 metal + water →', 'Metal hydroxide + hydrogen']],
      ex: 'Write electron structures for elements 1–20, then do a 6-marker on the development of the atomic model.' },
    { id: 'c-bonding', n: 'Bonding, structure & properties', p: ['sc1'], w: 3,
      pts: ['Ionic: metal + non-metal, electrons transferred, giant lattice, high melting point, conducts when molten or dissolved.',
        'Covalent: non-metals share pairs of electrons. Simple molecules have weak intermolecular forces → low boiling points, don\'t conduct.',
        'Diamond: each C has 4 covalent bonds — very hard, very high melting point, no conduction.',
        'Graphite: each C has 3 bonds, layers slide, delocalised electrons → conducts. Graphene: a single layer. Fullerenes: hollow cages and tubes.',
        'Metallic bonding: positive ions in a sea of delocalised electrons → conducts, malleable. Alloys are harder because different-sized atoms distort the layers.',
        'Draw dot-and-cross diagrams for NaCl, MgO, H₂, Cl₂, H₂O, NH₃, CH₄, HCl.'],
      cards: [['Why does graphite conduct electricity?', 'Each carbon has one delocalised electron that can move'], ['Why are alloys harder than pure metals?', 'Different-sized atoms distort the layers so they cannot slide'],
        ['Why does ionic NaCl have a high melting point?', 'Strong electrostatic forces between oppositely charged ions in a giant lattice need lots of energy to overcome'],
        ['Why do simple molecules have low boiling points?', 'Weak intermolecular forces, not covalent bonds, are broken'], ['When does an ionic compound conduct?', 'When molten or dissolved (ions free to move)']],
      ex: 'Draw 4 dot-and-cross diagrams from memory, then answer a "compare diamond and graphite" 6-marker.' },
    { id: 'c-quant', n: 'Quantitative chemistry', p: ['sc1'], w: 2,
      pts: ['Conservation of mass: total mass of reactants = total mass of products. Mass "lost" is usually a gas escaping.',
        'Relative formula mass (Mr) = sum of the relative atomic masses.',
        'H: moles = mass ÷ Mr. One mole contains 6.02 × 10²³ particles (Avogadro constant).',
        'H: reacting masses — use the mole ratio from the balanced equation. The limiting reactant is used up first.',
        'Concentration (g/dm³) = mass ÷ volume (dm³). 1 dm³ = 1000 cm³.'],
      cards: [['Mr of CO₂ (C = 12, O = 16)', '44'], ['Moles in 88 g of CO₂', '2 mol'], ['Concentration of 10 g in 250 cm³', '40 g/dm³'], ['Avogadro constant', '6.02 × 10²³']],
      ex: 'Do 5 calculations: Mr, % mass, concentration, and (H) two reacting-mass questions.' },
    { id: 'c-changes', n: 'Chemical changes, acids & electrolysis', p: ['sc1'], w: 3,
      pts: ['Reactivity series: K, Na, Li, Ca, Mg, (C), Zn, Fe, (H), Cu. Metals below carbon are extracted by reduction with carbon.',
        'Oxidation is gain of oxygen (H: loss of electrons — OIL RIG).',
        'Acid + metal → salt + hydrogen. Acid + alkali → salt + water. Acid + carbonate → salt + water + carbon dioxide. Neutralisation: H⁺ + OH⁻ → H₂O.',
        'Required practical: making a soluble salt — add excess insoluble base to acid, filter, evaporate, crystallise.',
        'Electrolysis: positive ions to the cathode (−), negative ions to the anode (+). Aluminium from aluminium oxide dissolved in cryolite (lower melting point). Carbon anodes burn away.',
        'Aqueous solutions: hydrogen forms at the cathode if the metal is more reactive than hydrogen. Oxygen forms at the anode unless a halide is present.'],
      cards: [['Acid + carbonate →', 'Salt + water + carbon dioxide'], ['OIL RIG', 'Oxidation Is Loss, Reduction Is Gain (of electrons)'],
        ['Why is aluminium oxide dissolved in cryolite?', 'Lowers the melting point, saving energy'], ['Electrolysis of NaCl solution: product at cathode', 'Hydrogen'],
        ['Why add excess base when making a salt?', 'To make sure all the acid reacts'], ['Why must carbon anodes be replaced?', 'They react with oxygen to form CO₂']],
      ex: 'Write the salt-making method from memory, then predict electrolysis products for 4 solutions.' },
    { id: 'c-energy', n: 'Energy changes', p: ['sc1'], w: 2,
      pts: ['Exothermic: energy released, temperature rises (combustion, neutralisation, hand warmers).',
        'Endothermic: energy taken in, temperature falls (thermal decomposition, sports injury packs).',
        'Reaction profiles: activation energy is the minimum energy needed to react. Exothermic products are lower than reactants.',
        'H: bond energy calculation — energy to break bonds − energy released making bonds. A negative result means exothermic.',
        'Required practical: temperature change in a polystyrene cup with a lid. Vary the concentration or amount of reactant.'],
      cards: [['Is neutralisation exo- or endothermic?', 'Exothermic'], ['Define activation energy', 'Minimum energy particles need to react'],
        ['Why use a polystyrene cup with a lid?', 'Reduces energy lost to the surroundings'], ['Bond energy: breaking > making means…', 'Endothermic overall']],
      ex: 'Sketch both reaction profiles from memory and do one bond-energy calculation (H).' },

    /* ---------- CHEMISTRY PAPER 2 ---------- */
    { id: 'c-rates', n: 'Rates & equilibrium', p: ['sc2'], w: 3,
      pts: ['Rate = amount of reactant used (or product made) ÷ time.',
        'Collision theory: particles must collide with at least the activation energy. More frequent successful collisions = faster reaction.',
        'Rate increases with temperature, concentration or pressure, surface area, and a catalyst (a catalyst lowers the activation energy and is not used up).',
        'Measure it by gas volume (syringe), mass loss, or a "disappearing cross" (sodium thiosulfate + acid). H: gradient of a tangent gives the rate at a point.',
        'Reversible reactions ⇌ reach equilibrium in a closed system (forward rate = backward rate).',
        'H: Le Chatelier — raising the temperature favours the endothermic direction. Raising the pressure favours the side with fewer gas molecules.'],
      cards: [['How does a catalyst increase rate?', 'Provides a pathway with lower activation energy'], ['Why does higher temperature increase rate?', 'Particles move faster → more frequent collisions, and more have enough energy'],
        ['Define equilibrium', 'Forward and reverse reactions happen at the same rate in a closed system'], ['Why does powder react faster than lumps?', 'Larger surface area → more frequent collisions'],
        ['How do you find the rate at a point on a curve? (H)', 'Draw a tangent and calculate its gradient']],
      ex: 'Plot a rate graph from data, draw a tangent (H), and write a 6-marker on the thiosulfate practical.' },
    { id: 'c-organic', n: 'Organic chemistry & crude oil', p: ['sc2'], w: 2, from: '2026-09-02',
      pts: ['Crude oil is a mixture of hydrocarbons, mostly alkanes CₙH₂ₙ₊₂: methane, ethane, propane, butane.',
        'Fractional distillation: heat and vaporise; fractions condense at different heights. Short chains at the top — low boiling point, runny, very flammable.',
        'Complete combustion: hydrocarbon + oxygen → carbon dioxide + water.',
        'Cracking (catalytic or steam) breaks long alkanes into shorter alkanes and alkenes, which are more useful and in higher demand.',
        'Alkenes have a C=C double bond. Test: bromine water goes from orange to colourless.'],
      cards: [['General formula of alkanes', 'CₙH₂ₙ₊₂'], ['Test for alkenes', 'Bromine water: orange → colourless'], ['Why crack long hydrocarbons?', 'To meet demand for shorter, more useful fuels and to make alkenes for polymers'],
        ['Properties of short-chain hydrocarbons', 'Low boiling point, low viscosity, very flammable'], ['Products of complete combustion', 'Carbon dioxide and water']],
      ex: 'Draw and explain the fractionating column, then balance 3 combustion and cracking equations.' },
    { id: 'c-analysis', n: 'Chemical analysis', p: ['sc2'], w: 2, from: '2026-11-02',
      pts: ['A pure substance is a single element or compound, with a sharp melting and boiling point.',
        'Formulations are mixtures in exact proportions for a purpose (paint, medicines, fuels).',
        'Chromatography: Rf = distance moved by the spot ÷ distance moved by the solvent. A pure substance gives one spot. Draw the start line in pencil.',
        'Gas tests: hydrogen — squeaky pop with a lit splint. Oxygen — relights a glowing splint. CO₂ — limewater turns milky. Chlorine — bleaches damp litmus paper.'],
      cards: [['Rf formula', 'Distance moved by spot ÷ distance moved by solvent'], ['Test for oxygen', 'Relights a glowing splint'], ['Test for chlorine', 'Bleaches damp litmus paper white'],
        ['Why draw the chromatography baseline in pencil?', 'Pencil doesn\'t dissolve in the solvent'], ['How do you tell a pure substance?', 'Sharp, specific melting/boiling point']],
      ex: 'Calculate 3 Rf values and answer the chromatography required-practical questions.' },
    { id: 'c-atmos', n: 'The atmosphere', p: ['sc2'], w: 2, from: '2027-01-04',
      pts: ['Early atmosphere: volcanoes released mainly CO₂, with water vapour and nitrogen. Water vapour condensed to form oceans.',
        'Algae and plants photosynthesised → oxygen increased and CO₂ decreased. CO₂ was locked into sedimentary rocks and fossil fuels.',
        'Now: about 80% nitrogen, about 20% oxygen, small amounts of CO₂, water vapour and noble gases.',
        'Greenhouse gases (CO₂, methane, water vapour) absorb infrared radiation. Human activity increases CO₂ (combustion, deforestation) and methane (farming, landfill).',
        'Pollutants: carbon monoxide (toxic, incomplete combustion), sulfur dioxide and nitrogen oxides (acid rain, breathing problems), soot particulates (global dimming).',
        'Carbon footprint = total greenhouse gases over a product\'s life cycle.'],
      cards: [['Main gas in the early atmosphere', 'Carbon dioxide'], ['Why did oxygen increase?', 'Photosynthesis by algae and plants'], ['Why is carbon monoxide dangerous?', 'Toxic — stops blood carrying oxygen'],
        ['Two human sources of methane', 'Farming (cattle, rice) and landfill'], ['Rough composition of air today', '~80% nitrogen, ~20% oxygen']],
      ex: 'Write a 6-marker on how the atmosphere has changed, then a climate-change evaluation.' },
    { id: 'c-resources', n: 'Using resources & water', p: ['sc2'], w: 2, from: '2027-01-04',
      pts: ['Potable water is safe to drink. UK fresh water: filtered, then sterilised (chlorine, ozone or UV). Sea water: desalination by distillation or reverse osmosis (costly in energy).',
        'Waste water: screening → sedimentation → anaerobic digestion of sludge, aerobic treatment of effluent.',
        'H: phytomining (plants absorb metal, then burn to ash) and bioleaching (bacteria) extract low-grade copper ores.',
        'Life cycle assessment: raw materials, manufacture, use, disposal.',
        'Reduce, reuse, recycle to save resources and energy.',
        'Required practical: analyse and purify water — test pH, evaporate to find dissolved solids, distil.'],
      cards: [['Two ways to sterilise water', 'Chlorine, ozone or UV light'], ['Why is desalination expensive?', 'Needs lots of energy'], ['Four stages of a life cycle assessment', 'Raw materials, manufacture, use, disposal'],
        ['What is phytomining? (H)', 'Plants absorb metal compounds; burned to give ash rich in metal']],
      ex: 'Answer a life-cycle-assessment comparison question (e.g. paper vs plastic bags).' },

    /* ---------- PHYSICS PAPER 1 ---------- */
    { id: 'p-energy', n: 'Energy', p: ['sp1'], w: 3,
      pts: ['Energy stores: kinetic, gravitational potential, elastic, thermal, chemical, magnetic, electrostatic, nuclear.',
        'Kinetic energy = ½mv². GPE = mgh. Elastic PE = ½ke².',
        'Specific heat capacity: ΔE = mcΔθ. Required practical: heat a block with an immersion heater, measure energy in and temperature rise.',
        'Power = energy ÷ time = work done ÷ time. Efficiency = useful output ÷ total input.',
        'Reduce unwanted transfers with lubrication and thermal insulation. Thicker, lower-conductivity walls lose heat more slowly.',
        'Resources: renewable (solar, wind, hydro, tidal, wave, geothermal, biofuel) vs non-renewable (coal, oil, gas, nuclear). Compare reliability, cost and environmental impact.'],
      cards: [['Kinetic energy equation', 'Eₖ = ½mv²'], ['GPE equation', 'Eₚ = mgh'], ['Specific heat capacity equation', 'ΔE = mcΔθ'],
        ['Efficiency', 'Useful output ÷ total input'], ['One advantage and one disadvantage of wind power', 'Renewable, no CO₂ / unreliable and visual impact'], ['Unit of power', 'Watt (W) = J/s']],
      ex: 'Do 5 energy calculations (including rearranging ½mv²) and one 6-marker comparing energy resources.' },
    { id: 'p-elec', n: 'Electricity', p: ['sp1'], w: 3,
      pts: ['Charge Q = It. Potential difference V = IR. Power P = VI = I²R. Energy E = Pt = QV.',
        'Series: same current everywhere, p.d. shared, R total = R₁ + R₂. Parallel: same p.d. on each branch, currents add, total R is less than the smallest.',
        'I–V graphs: fixed resistor is a straight line through the origin. Filament lamp curves (resistance rises with temperature). Diode lets current flow one way only.',
        'LDR: resistance falls as light increases. Thermistor: resistance falls as temperature increases.',
        'UK mains: 230 V, 50 Hz a.c. Live (brown), neutral (blue), earth (green/yellow). Fuses and earthing are for safety.',
        'National Grid: step-up transformers raise the p.d. (lower current, less energy loss); step-down transformers make it safe for homes.'],
      cards: [['V = ?', 'IR'], ['Resistance in parallel is…', 'Less than the smallest individual resistor'], ['What happens to an LDR in bright light?', 'Resistance decreases'],
        ['Colour of the live wire', 'Brown'], ['Why does the National Grid use high voltage?', 'Lower current → less energy lost as heat in cables'], ['UK mains frequency and p.d.', '50 Hz, 230 V']],
      ex: 'Do 4 circuit calculations, then sketch the three I–V graphs from memory and explain the filament lamp.' },
    { id: 'p-particles', n: 'Particle model of matter', p: ['sp1'], w: 2,
      pts: ['Density ρ = m ÷ V. Required practical: regular shapes (measure dimensions) and irregular shapes (displacement / eureka can).',
        'Solids → liquids → gases: particles get further apart and move more. Density is usually lowest as a gas.',
        'Internal energy = kinetic + potential energy of the particles. Heating raises temperature OR changes state.',
        'Specific latent heat: E = mL. Fusion = melting/freezing. Vaporisation = boiling/condensing. Temperature stays constant during a change of state.',
        'Gas pressure: particles collide with the walls. Hotter at constant volume → faster particles → more frequent, harder collisions → higher pressure.'],
      cards: [['Density equation', 'ρ = m/V'], ['Why is temperature constant while ice melts?', 'Energy breaks bonds (raises potential energy) instead of kinetic energy'],
        ['Specific latent heat equation', 'E = mL'], ['Why does gas pressure rise when heated in a sealed container?', 'Particles move faster, hitting the walls more often and harder']],

/* ---------- session overlay ---------- */
let sess = null, timerInt = null;
function openSession(opts) {
  // opts: {i, date} from plan, or {t} ad-hoc topic
  let b;
  if (opts.i != null) b = state.plans[opts.date].blocks[opts.i];
  else b = { k: kindFor(st(opts.t).c || 0, dayInfo(D.today()).phase.id, 99), t: opts.t, m: 25 };
  if (b.k === 'cards') { startCards('review', opts); return; }
  const steps = KIND[b.k].steps;
  sess = { b, opts, steps, step: 0, left: b.m * 60, running: false, checks: {}, rating: 0, cardQ: null, score: '', max: '' };
  $('#session').hidden = false; document.body.style.overflow = 'hidden';
  renderSession();
}
function closeSession() {
  clearInterval(timerInt); timerInt = null; sess = null;
  $('#session').hidden = true; $('#session').innerHTML = ''; document.body.style.overflow = '';
  render();
}
function tick() {
  if (!sess || !sess.running) return;
  sess.left = Math.max(0, sess.left - 1);
  const c = $('#clock'); if (c) c.textContent = fmtClock(sess.left);
  if (sess.left === 0) { sess.running = false; clearInterval(timerInt); timerInt = null; const tb = $('#timer-btn'); if (tb) tb.textContent = 'Restart'; toast('Time! Finish your step, then take a 5-minute break.'); }
}
function fmtClock(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function renderSession() {
  const s = sess, b = s.b, step = s.steps[s.step];
  const t = b.t ? TOPIC[b.t] : null, p = b.pid ? PAPER[b.pid] : null, subj = t ? t.subj : p.subj;
  let h = `<div class="sess-in"><div class="sess-top"><button class="x" data-act="close" aria-label="Close session">×</button><div class="grow"><div class="eyebrow" style="color:${scol(subj.id)}">${esc(subj.name)} · ${esc(KIND[b.k].label)}</div><div style="font-weight:700;line-height:1.25">${esc(t ? t.n : p.name)}</div></div>
    <div class="timer"><span class="clock" id="clock">${fmtClock(s.left)}</span><button class="btn small" id="timer-btn" data-act="timer">${s.running ? 'Pause' : (s.left === b.m * 60 ? 'Start timer' : 'Resume')}</button></div></div>`;
  h += '<div class="steps">' + s.steps.map((x, i) => `<i class="${i < s.step ? 'done' : i === s.step ? 'on' : ''}"></i>`).join('') + '</div>';
  h += '<div class="step-card">' + stepBody(step, t, p) + '</div></div>';
  $('#session').innerHTML = h;
  const f = $('#session .focus-me'); if (f) f.focus();
}
function stepNav(nextLabel, disabled) {
  return `<div class="sess-foot">${sess.step > 0 ? '<button class="btn" data-act="prev">Back</button>' : '<span></span>'}<button class="btn primary" data-act="next" ${disabled ? 'disabled' : ''}>${esc(nextLabel || 'Next')}</button></div>`;
}
function stepBody(step, t, p) {
  const s = sess;
  if (step === 'read') return `<h2>1 · Learn it (about 8 min)</h2><p class="muted">Read each point, then turn it into a quick mind map or a set of 5 questions on paper — don't copy it out.</p><div class="card"><ul class="pts">${t.pts.map((x) => '<li>' + esc(x) + '</li>').join('')}</ul></div>${stepNav('I\'ve made my notes — hide them')}`;
  if (step === 'blurt') return `<h2>${s.steps[0] === 'blurt' ? '1' : '2'} · Blurt (5 min)</h2><div class="card stack"><p><b>Close everything.</b> On a blank sheet, write down everything you can remember about <b>${esc(t.n)}</b>: key words, facts, examples, diagrams, equations.</p><p class="muted small">Struggling to remember is what makes the memory stronger — don't peek.</p></div>${stepNav('Done — check my blurt')}`;
  if (step === 'check') {
    const n = t.pts.length, got = Object.values(s.checks).filter(Boolean).length;
    return `<h2>Check against the key points</h2><p class="muted">Tick each point you got (roughly) right. In a different colour, add what you missed to your sheet.</p><div class="checkl">${t.pts.map((x, i) => `<label><input type="checkbox" id="chk-${i}" data-chk="${i}" ${s.checks[i] ? 'checked' : ''}><span>${esc(x)}</span></label>`).join('')}</div><p class="small muted mono">${got}/${n} recalled</p>${stepNav('Next')}`;
  }
  if (step === 'cards') {
    if (!s.cardQ) s.cardQ = { list: t.cardIds.slice(), i: 0, flip: false, right: 0, requeued: {} };
    const q = s.cardQ;
    if (!t.cardIds.length || q.i >= q.list.length) return `<h2>Flashcards</h2><div class="card empty">${t.cardIds.length ? `Cards done — ${q.right} right first time. They're now in your spaced-repetition deck.` : 'No flashcards for this topic.'}</div>${stepNav('Next')}`;
    const c = CARD[q.list[q.i]];
    return `<h2>Flashcards <span class="muted mono small">${q.i + 1}/${q.list.length}</span></h2>${cardFace(c, q.flip)}${q.flip ? `<div class="grade"><button class="no" data-act="sc-no">Didn't know</button><button class="yes" data-act="sc-yes">Knew it</button></div>` : '<p class="small muted" style="text-align:center">Say the answer out loud, then tap the card.</p>'}${stepNav('Skip cards')}`;
  }
  if (step === 'apply') {
    return `<h2>Apply it — exam style (${s.steps[0] === 'apply' ? '15' : '8'} min)</h2><div class="card stack"><p>${esc(t.ex)}</p><p class="small muted">Use past-paper questions on this topic and mark them with the official mark scheme.</p><div class="wrap-row">${t.subj.resources.map((r) => `<a class="btn small" href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])} ↗</a>`).join('')}</div></div><div class="flat small"><b>Technique reminder:</b> ${esc(t.subj.technique[0])}</div>${stepNav('Done')}`;
  }
  if (step === 'rate') {
    const got = Object.values(s.checks).filter(Boolean).length, n = t.pts.length;
    const sug = s.steps.includes('check') && Object.keys(s.checks).length ? Math.max(1, Math.min(5, Math.round(got / n * 5))) : 0;
    const np = nextPaper(t, D.today()); const dx = np ? D.diff(D.today(), np.date) : null;
    const nxt = s.rating ? D.short(D.add(D.today(), intervalFor(s.rating, (st(t.id).n || 0) + 1, dx))) : '';
    return `<h2>How confident are you now?</h2>${sug ? `<p class="muted small">You recalled ${got}/${n} points — that suggests about ${sug}.</p>` : ''}<div class="rate-big">${[1, 2, 3, 4, 5].map((r) => `<button data-act="pick" data-r="${r}" aria-pressed="${s.rating === r}"><b style="background:${ccol(r)}">${r}</b><span style="font-weight:700">${esc(CONF_WORD[r])}</span></button>`).join('')}</div>${nxt ? `<p class="small muted">Next review of this topic: <b>${esc(nxt)}</b></p>` : ''}${stepNav('Save & finish', !s.rating)}`;
  }
  if (step === 'paper') {
    return `<h2>Timed past paper — ${esc(p.subj.name)}</h2><div class="card stack"><p><b>${esc(p.name)}</b> (${esc(p.subj.board)} ${esc(p.code)}) — ${minsTxt(p.dur)} under exam conditions: timer on, phone away, no notes.</p>
      <ol class="small" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px"><li>Pick a paper you haven't done (download it from the board's site).</li><li>Do it in one sitting. Stop when time is up.</li><li>Mark it strictly with the mark scheme (about 15 min).</li><li>Next screen: log your score and tap the topics that lost you marks.</li></ol>
      <div class="wrap-row">${p.subj.resources.map((r) => `<a class="btn small" href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])} ↗</a>`).join('')}</div></div>${stepNav('I\'ve marked it')}`;
  }
  if (step === 'score') {
    const ts = visibleTopics(p.subj).filter((t) => t.paperIds.includes(p.id));
    return `<h2>Log your score</h2><div class="card stack"><div class="row" style="flex-wrap:wrap"><label class="row">Score <input type="number" id="p-score" min="0" inputmode="numeric" value="${esc(s.score)}" style="width:90px"></label><label class="row">out of <input type="number" id="p-max" min="1" inputmode="numeric" value="${esc(s.max)}" style="width:90px"></label></div></div>
      <h3>Which topics lost you marks?</h3><p class="small muted">Tapped topics are marked weak (2/5) and scheduled for tomorrow.</p><div class="checkl">${ts.map((t) => `<label><input type="checkbox" id="weak-${t.id}" data-weak="${t.id}" ${s.checks[t.id] ? 'checked' : ''}><span>${esc(t.n)}</span></label>`).join('')}</div>${stepNav('Save & finish')}`;
  }
  return '';
}
function cardFace(c, flip) {
  return `<div class="fc" role="button" tabindex="0" data-act="flip" aria-label="Flashcard — tap to ${flip ? 'hide' : 'show'} the answer"><span class="src" style="color:${scol(c.t.subj.id)}">${esc(c.t.subj.name)} · ${esc(c.t.n)}</span><div class="q">${esc(c.q)}</div>${flip ? `<div class="a">${esc(c.a)}</div>` : '<div class="hint">Tap to reveal</div>'}</div>`;
}
function finishSession() {
  const s = sess, b = s.b, d = D.today();
  if (b.t) {
    rateTopic(b.t, s.rating, d);
    logMinutes(d, TOPIC[b.t].subj.id, b.m);
  } else if (b.pid) {
    const sc = Number(s.score), mx = Number(s.max);
    (state.papersDone[b.pid] = state.papersDone[b.pid] || []).push({ d, sc: isFinite(sc) ? sc : null, mx: isFinite(mx) && mx > 0 ? mx : null });
    for (const id of Object.keys(s.checks)) if (s.checks[id] && TOPIC[id]) state.topics[id] = Object.assign({}, st(id), { c: 2, due: D.add(d, 1) });
    logMinutes(d, PAPER[b.pid].subj.id, b.m);
  }
  if (s.opts.i != null && state.plans[s.opts.date]) state.plans[s.opts.date].done[s.opts.i] = b.t ? s.rating : 1;
  save();
  toast(b.t ? 'Saved — next review ' + D.short(state.topics[b.t].due) : 'Paper logged');
  closeSession();
}

/* ---------- flashcard review overlay ---------- */
function startCards(mode, opts) {
  const d = D.today();
  let list;
  if (mode === 'cram') {
    const pool = Object.keys(state.cards).map((id) => CARD[id]).filter((c) => c && cardAvailable(c) && (!cardsSubj || c.t.subj.id === cardsSubj));
    const fresh = newCardPool(cardsSubj);
    const all = pool.concat(fresh);
    list = all.map((c) => [hash(c.id + Date.now()), c]).sort((a, b) => a[0] - b[0]).slice(0, 20).map((x) => x[1].id);
  } else {
    const subj = opts && opts.i != null ? null : cardsSubj;
    list = dueCards(d, subj).slice(0, 60).map((c) => c.id).concat(newCardPool(subj).slice(0, newAllowance(d)).map((c) => c.id));
  }
  sess = { b: { k: 'cards', m: 15 }, opts: opts || {}, deck: { list, i: 0, flip: false, right: 0, wrong: 0, again: {} }, mode, left: 15 * 60, running: false };
  $('#session').hidden = false; document.body.style.overflow = 'hidden';
  renderDeck();
}
function renderDeck() {
  const q = sess.deck;
  let h = `<div class="sess-in"><div class="sess-top"><button class="x" data-act="close" aria-label="Close flashcards">×</button><div class="grow"><div class="eyebrow">${sess.mode === 'cram' ? 'Practice set' : 'Spaced repetition'}</div><div style="font-weight:700">Flashcards</div></div><div class="mono small muted">${Math.min(q.i + 1, q.list.length)}/${q.list.length}</div></div>`;
  h += `<div class="steps">${q.list.length ? `<i class="on" style="flex:none;width:${Math.round(q.i / q.list.length * 100)}%"></i><i style="flex:1"></i>` : '<i></i>'}</div>`;
  if (q.i >= q.list.length) {
    h += `<div class="card empty stack"><h2>${q.list.length ? 'Deck complete' : 'Nothing due'}</h2><p>${q.list.length ? `${q.right} right · ${q.wrong} to see again tomorrow` : 'No cards are due right now. Come back tomorrow, or practise a random set.'}</p></div>`;
    h += `<div class="sess-foot"><span></span><button class="btn primary focus-me" data-act="deck-done">Finish</button></div>`;
  } else {
    const c = CARD[q.list[q.i]];
    h += cardFace(c, q.flip);
    h += q.flip ? '<div class="grade"><button class="no" data-act="dk-no">Didn\'t know <span class="mono small">(1)</span></button><button class="yes" data-act="dk-yes">Knew it <span class="mono small">(2)</span></button></div>' : '<p class="small muted" style="text-align:center">Say the answer, then tap the card (or press Space).</p>';
    const cs = state.cards[c.id];
    h += `<p class="small muted" style="text-align:center">${cs ? 'Box ' + cs.b : 'New card'}</p>`;
  }
  h += '</div>';
  $('#session').innerHTML = h;
  const f = $('#session .focus-me'); if (f) f.focus();
}
function deckGrade(ok) {
  const q = sess.deck, id = q.list[q.i], d = D.today();
  if (sess.mode === 'cram') { if (ok) q.right++; else q.wrong++; if (state.cards[id] || ok) gradeCard(id, ok, d); }
  else {
    if (!q.again[id]) gradeCard(id, ok, d);
    if (ok) q.right++; else { q.wrong++; if (!q.again[id]) { q.again[id] = 1; q.list.push(id); } }
  }
  q.i++; q.flip = false;
  save(); renderDeck();
}
function deckDone() {
  const o = sess.opts;
  if (o && o.i != null && state.plans[o.date]) { state.plans[o.date].done[o.i] = 1; logMinutes(o.date, null, 15); save(); }
  closeSession();
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act],[data-rate],[data-topic],[data-unlock],[data-tab],[data-cs],[data-chk],[data-weak]');
  if (!el) return;
  if (el.dataset.rate) {
    quickRate(el.dataset.rate, Number(el.dataset.r)); save();
    const grp = el.parentElement; $$('button', grp).forEach((b) => b.setAttribute('aria-pressed', b === el ? 'true' : 'false'));
    return;
  }
  if (el.dataset.topic) { go('subjects', el.dataset.topic); return; }
  if (el.dataset.unlock) { state.unlocked[el.dataset.unlock] = true; save(); render(); toast('Added to your plan'); return; }
  if (el.dataset.tab) { planTab = el.dataset.tab; render(); return; }
  if (el.dataset.cs != null && el.closest('.seg')) { cardsSubj = el.dataset.cs || null; render(); return; }
  if (el.dataset.chk != null) { sess.checks[el.dataset.chk] = el.checked; const m = $('#session .mono.small'); if (m) m.textContent = Object.values(sess.checks).filter(Boolean).length + '/' + TOPIC[sess.b.t].pts.length + ' recalled'; return; }
  if (el.dataset.weak) { sess.checks[el.dataset.weak] = el.checked; return; }
  const a = el.dataset.act, d = D.today();
  switch (a) {
    case 'start': openSession({ i: Number(el.dataset.i), date: d }); break;
    case 'revise': openSession({ t: el.dataset.t }); break;
    case 'rebuild': rebuildPlan(d); render(); toast('Rebuilt from your latest ratings'); break;
    case 'close': if (sess && sess.deck) deckDone(); else closeSession(); break;
    case 'timer':
      if (!sess) break;
      if (sess.left === 0) sess.left = sess.b.m * 60;
      sess.running = !sess.running;
      clearInterval(timerInt); timerInt = sess.running ? setInterval(tick, 1000) : null;
      el.textContent = sess.running ? 'Pause' : 'Resume'; break;
    case 'next': {
      const step = sess.steps[sess.step];
      if (step === 'score') { sess.score = ($('#p-score') || {}).value || ''; sess.max = ($('#p-max') || {}).value || ''; finishSession(); break; }
      if (step === 'rate') { if (sess.rating) finishSession(); break; }
      sess.step++; renderSession(); window.scrollTo(0, 0); $('#session').scrollTop = 0; break;
    }
    case 'prev': sess.step = Math.max(0, sess.step - 1); renderSession(); break;
    case 'pick': sess.rating = Number(el.dataset.r); renderSession(); break;
    case 'flip':
      if (sess.deck) { sess.deck.flip = !sess.deck.flip; renderDeck(); }
      else if (sess.cardQ) { sess.cardQ.flip = !sess.cardQ.flip; renderSession(); }
      break;
    case 'sc-yes': case 'sc-no': {
      const q = sess.cardQ, id = q.list[q.i], ok = a === 'sc-yes';
      if (!q.requeued[id]) gradeCard(id, ok, d);
      if (ok) { if (!q.requeued[id]) q.right++; } else if (!q.requeued[id]) { q.requeued[id] = 1; q.list.push(id); }
      q.i++; q.flip = false; save(); renderSession(); break;
    }
    case 'dk-yes': deckGrade(true); break;
    case 'dk-no': deckGrade(false); break;
    case 'deck-done': deckDone(); break;
    case 'review': startCards('review'); break;
    case 'cram': startCards('cram'); break;
    case 'export': {
      const txt = JSON.stringify(state); const ta = $('#backup'); ta.value = txt;
      const done = () => toast('Backup copied');
      try { navigator.clipboard.writeText(txt).then(done, () => { ta.select(); toast('Select-all and copy the box'); }); } catch (err) { ta.select(); toast('Select-all and copy the box'); }
      break;
    }
    case 'import': {
      try { const obj = JSON.parse($('#backup').value); if (!obj || !obj.settings) throw new Error('bad'); state = migrate(obj); applySettings(); save(); render(); toast('Progress restored'); }
      catch (err) { toast('That doesn\'t look like a backup — paste the whole text'); }
      break;
    }
    case 'reset': $('#reset-confirm').innerHTML = '<button class="btn small" data-act="reset-yes" style="color:var(--c1)">Yes, delete all my progress</button>'; break;
    case 'reset-yes': { const keep = state.settings; state = defaultState(); state.settings = keep; save(); render(); toast('Progress reset'); break; }
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.chk != null || el.dataset.weak) return; // handled on click
  if (el.dataset.tier) { state.settings.tiers[el.dataset.tier] = el.value; afterSettings(); }
  else if (el.dataset.mock != null) { const m = state.settings.mocks[Number(el.dataset.mock)]; if (el.value) m[el.dataset.f] = el.value; if (m.end < m.start) m.end = m.start; afterSettings(); }
  else if (el.dataset.speaking != null) { if (el.value) state.settings.speakingDate = el.value; applySettings(); afterSettings(); }
  else if (el.dataset.intensity != null) { state.settings.intensity = Number(el.value); afterSettings(); }
  else if (el.dataset.restday != null) { state.settings.restDay = Number(el.value); afterSettings(); }
});
function afterSettings() { rebuildPlan(D.today()); save(); toast('Plan updated'); render(); }
document.addEventListener('keydown', (e) => {
  if (!sess) return;
  if (e.key === 'Escape') { if (sess.deck) deckDone(); else closeSession(); return; }
  const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName);
  if (inField) return;
  if (sess.deck && sess.deck.i < sess.deck.list.length) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); sess.deck.flip = !sess.deck.flip; renderDeck(); }
    else if (sess.deck.flip && e.key === '1') deckGrade(false);
    else if (sess.deck.flip && e.key === '2') deckGrade(true);
  }
});
function readHash() {
  const h = location.hash.slice(1);
  const [r, ...rest] = h.split('-'); const s = rest.join('-');
  route = ['today', 'plan', 'subjects', 'cards', 'more', 'rate'].includes(r) ? r : 'today';
  sub = s || null;
}
window.addEventListener('hashchange', () => { readHash(); if (sess) closeSession(); render(); window.scrollTo(0, 0); });

/* ---------- boot ---------- */
function boot() {
  $('#nav').innerHTML = '<div class="nav-in">' + [['today', 'Today'], ['plan', 'Plan'], ['subjects', 'Subjects'], ['cards', 'Cards'], ['more', 'Settings']]
    .map(([r, l]) => `<a href="#${r}" data-r="${r}">${ICON[r]}<span>${l}</span></a>`).join('') + '</div>';
  readHash(); render();
  initCloud();
  // roll over to a new day if the app stays open past midnight
  let day = D.today();
  setInterval(() => { if (D.today() !== day) { day = D.today(); if (!sess) render(); } }, 60000);
}
boot();

</script>
