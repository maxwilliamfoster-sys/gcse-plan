<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Max's GCSE Plan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GCSE Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="firebase-config.js"></script>
<meta name="theme-color" content="#58CC02">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* ============================================================
   GCSE Plan — bright, chunky, friendly UI
   One rounded face (Nunito), vivid subject colours, 3D "press" buttons.
   ============================================================ */
:root{
  --bg:#FFFFFF; --bg-2:#F7F7F7; --card:#FFFFFF; --line:#E5E5E5; --line-2:#F0F0F0;
  --ink:#3C3C3C; --ink-2:#777777; --ink-3:#AFAFAF; --on:#FFFFFF;
  --green:#58CC02; --green-d:#58A700; --green-t:#D7FFB8;
  --blue:#1CB0F6;  --blue-d:#1899D6;  --blue-t:#DDF4FF;
  --red:#FF4B4B;   --red-d:#EA2B2B;   --red-t:#FFDFE0;
  --yellow:#FFC800;--yellow-d:#E5A800;--yellow-t:#FFF5D3;
  --orange:#FF9600;--orange-d:#E07B00;--orange-t:#FFEBD1;
  --purple:#CE82FF;--purple-d:#A568CC;--purple-t:#F4E6FF;
  --teal:#00CD9C;  --teal-d:#00A57D;  --teal-t:#D3FAEF;
  --pink:#FF6AB4;  --pink-d:#DB4595;  --pink-t:#FFE3F1;
  --maths:var(--blue); --maths-d:var(--blue-d); --maths-t:var(--blue-t);
  --science:var(--green); --science-d:var(--green-d); --science-t:var(--green-t);
  --englang:var(--red); --englang-d:var(--red-d); --englang-t:var(--red-t);
  --englit:var(--purple); --englit-d:var(--purple-d); --englit-t:var(--purple-t);
  --geog:var(--teal); --geog-d:var(--teal-d); --geog-t:var(--teal-t);
  --hist:var(--orange); --hist-d:var(--orange-d); --hist-t:var(--orange-t);
  --german:var(--pink); --german-d:var(--pink-d); --german-t:var(--pink-t);
  --c0:#E5E5E5; --c1:#FF4B4B; --c2:#FF9600; --c3:#FFC800; --c4:#89E219; --c5:#58CC02;
  --gold:#FFC800; --gold-d:#E5A800;
  --r:16px; --r-lg:20px;
  --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.9,.3,1.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131F24; --bg-2:#1B2A31; --card:#131F24; --line:#37464F; --line-2:#26353D;
    --ink:#F1F7FB; --ink-2:#A0B0BA; --ink-3:#52656D;
    --green-t:#1F3A14; --blue-t:#11303F; --red-t:#3E1C1F; --yellow-t:#3A3112; --orange-t:#3B2711; --purple-t:#2F2140; --teal-t:#10352C; --pink-t:#3D1B2E;
    --c0:#37464F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131F24; --bg-2:#1B2A31; --card:#131F24; --line:#37464F; --line-2:#26353D;
  --ink:#F1F7FB; --ink-2:#A0B0BA; --ink-3:#52656D;
  --green-t:#1F3A14; --blue-t:#11303F; --red-t:#3E1C1F; --yellow-t:#3A3112; --orange-t:#3B2711; --purple-t:#2F2140; --teal-t:#10352C; --pink-t:#3D1B2E;
  --c0:#37464F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:600 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:12px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance;line-height:1.15}
h1{font-size:27px} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
.muted{color:var(--ink-2)} .small{font-size:14px} .tiny{font-size:12.5px}
.caps{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:6px calc(110px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.wrap-row{display:flex;flex-wrap:wrap;gap:8px}
.grow{flex:1;min-width:0}
.sect{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.sect-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px}
.soft{background:var(--bg-2);border-radius:var(--r);padding:14px}
.ico{width:24px;height:24px;flex:none}
.ico.sm{width:18px;height:18px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);border-bottom:2px solid var(--line-2)}
.top-in{max-width:640px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;color:var(--green);text-decoration:none;margin-right:auto;letter-spacing:-.02em}
.logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--green);color:#fff;font-style:normal;font-size:14px;box-shadow:0 3px 0 var(--green-d)}
.stat{display:inline-flex;align-items:center;gap:4px;padding:6px 8px;border-radius:12px;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;text-decoration:none}
.stat .ico{width:22px;height:22px}
.stat.fire{color:var(--orange)} .stat.fire.off{color:var(--ink-3)}
.stat.xp{color:var(--yellow-d)} .stat.days{color:var(--blue)}
.stat.bump{animation:bump .5s var(--ease)}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:2px solid var(--line-2);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;border:2px solid transparent;text-decoration:none;color:var(--ink-3);font-weight:800;font-size:11px;letter-spacing:.02em;transition:background .15s}
.nav a .ico{width:28px;height:28px}
.nav a[aria-current="page"]{background:var(--blue-t);border-color:var(--blue);color:var(--blue)}
.nav a:active{transform:scale(.94)}
.nav[hidden]{display:none!important}

/* ---------- 3D buttons ---------- */
.btn{--b:var(--card);--bd:var(--line);--fg:var(--blue);appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:var(--r);border:2px solid var(--bd);background:var(--b);color:var(--fg);font-weight:900;font-size:15px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:0 4px 0 var(--bd);transition:transform .08s,box-shadow .08s,filter .15s;user-select:none;-webkit-user-select:none}
.btn:hover{filter:brightness(1.04)}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 0 0 var(--bd)}
.btn[disabled]{--b:var(--line);--bd:var(--line);--fg:var(--ink-3);box-shadow:none;cursor:default}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13px;box-shadow:0 3px 0 var(--bd)}
.btn.green{--b:var(--green);--bd:var(--green-d);--fg:#fff}
.btn.blue{--b:var(--blue);--bd:var(--blue-d);--fg:#fff}
.btn.red{--b:var(--red);--bd:var(--red-d);--fg:#fff}
.btn.yellow{--b:var(--yellow);--bd:var(--yellow-d);--fg:#4B3A00}
.btn.ghost{--b:transparent;--bd:transparent;box-shadow:none;--fg:var(--blue)}
.btn.plain{--fg:var(--ink-2)}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--blue);font-weight:800;cursor:pointer;font-size:14px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- chips & tags ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--bg-2);color:var(--ink-2);font-weight:800;font-size:13px;white-space:nowrap}
.chip.c{background:var(--t,var(--bg-2));color:var(--d,var(--ink-2))}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tag{display:inline-block;font-weight:900;font-size:11px;letter-spacing:.06em;padding:3px 7px;border-radius:7px;background:var(--bg-2);color:var(--ink-2)}

/* ---------- today header ---------- */
.hello{padding-top:14px;display:flex;flex-direction:column;gap:4px}
.goal{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.goal .ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);position:relative}
.goal .ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--card)}
.goal .ring b{position:relative;font-weight:900;font-size:15px}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green);position:relative;transition:width .6s var(--ease);min-width:0}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.unit{border-radius:var(--r-lg);padding:16px 16px 16px 18px;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-d);display:flex;align-items:center;gap:12px}
.unit .caps{color:rgba(255,255,255,.85)}
.unit h2{color:#fff;font-size:20px;margin-top:2px}
.unit p{color:rgba(255,255,255,.92);font-size:14px;margin-top:4px}
.unit .btn{--b:rgba(255,255,255,.18);--bd:rgba(0,0,0,.14);--fg:#fff;border-color:rgba(255,255,255,.4);flex:none}

/* ---------- lesson path ---------- */
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding:22px 0 8px}
.pn{display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateX(var(--off,0));position:relative;width:170px}
.node{appearance:none;border:0;cursor:pointer;width:74px;height:68px;border-radius:50%;background:var(--nc,var(--green));box-shadow:0 8px 0 var(--nd,var(--green-d));display:grid;place-items:center;color:#fff;transition:transform .1s,box-shadow .1s;position:relative}
.node .ico{width:34px;height:34px}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--nd,var(--green-d))}
.node.done{--nc:var(--gold);--nd:var(--gold-d)}
.node.cur::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--line);pointer-events:none}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--nc,var(--green));clip-path:inset(0 0 50% 0);pointer-events:none;opacity:.9}
.pn.hb{margin-top:38px}
.pn .lbl{font-weight:800;font-size:13.5px;line-height:1.25;text-align:center;color:var(--ink);max-width:170px}
.pn .lbl small{display:block;color:var(--ink-3);font-size:12px;font-weight:800}
.bubble{position:absolute;top:-44px;padding:7px 12px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:900;font-size:13px;letter-spacing:.06em;color:var(--nc,var(--green));text-transform:uppercase;animation:float 1.6s ease-in-out infinite;white-space:nowrap;z-index:1}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.pop{width:100%;max-width:420px;border-radius:var(--r-lg);padding:16px;background:var(--pc,var(--green));color:#fff;box-shadow:0 5px 0 var(--pd,var(--green-d));animation:popin .25s var(--ease);display:flex;flex-direction:column;gap:10px}
.pop h3{color:#fff}
.pop .meta{color:rgba(255,255,255,.92);font-size:14px}
.pop .btn{--b:#fff;--bd:rgba(0,0,0,.18);--fg:var(--pd,var(--green-d))}
.pop.gold{--pc:var(--gold);--pd:var(--gold-d);color:#4B3A00}
.pop.gold h3,.pop.gold .meta{color:#4B3A00}
.pop.dark-text{color:#4B3A00}
.pop.dark-text h3,.pop.dark-text .meta{color:#4B3A00}
.path-end{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink-3);font-weight:800;padding-top:4px;text-align:center}
.trophy{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--line);color:var(--ink-3)}
.trophy .ico{width:34px;height:34px}
.trophy.won{background:var(--gold);color:#fff;box-shadow:0 5px 0 var(--gold-d);animation:wiggle 1.2s ease-in-out infinite}

/* ---------- alerts ---------- */
.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px;background:var(--t,var(--blue-t));color:var(--ink);font-weight:700;font-size:15px}
.note .ico{color:var(--d,var(--blue));margin-top:1px}
.note a{font-weight:900}

/* ---------- next exam + week ---------- */
.exam{display:flex;align-items:center;gap:14px}
.cal{width:62px;flex:none;border-radius:14px;overflow:hidden;border:2px solid var(--line);text-align:center;background:var(--card)}
.cal b{display:block;background:var(--red);color:#fff;font-size:11px;font-weight:900;letter-spacing:.08em;padding:3px 0;text-transform:uppercase}
.cal span{display:block;font-size:24px;font-weight:900;padding:2px 0 4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:12px;color:var(--ink-3)}
.week .f{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--bg-2);color:var(--ink-3)}
.week .f .ico{width:22px;height:22px}
.week .d.hit .f{background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange-d)}
.week .d.today{color:var(--ink)}
.week .d.today .f{outline:3px solid var(--blue);outline-offset:2px}
details.why summary{cursor:pointer;font-weight:800;color:var(--blue);list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);font-size:14.5px}

/* ---------- segmented tabs ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;flex:none;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;font-weight:800;font-size:14px;color:var(--ink-2);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tabs button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-t);color:var(--blue);box-shadow:0 3px 0 var(--blue)}

/* ---------- plan ---------- */
.day{display:flex;flex-direction:column;gap:8px}
.day-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-h b{font-weight:900;font-size:16px}
.fl{display:flex;align-items:center;gap:10px;font-size:14.5px;line-height:1.3;font-weight:700}
.fl .sq{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.fl .sq .ico{width:18px;height:18px}
.road{display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:44px 1fr;gap:12px;padding-bottom:20px;position:relative}
.stage::before{content:"";position:absolute;left:20px;top:44px;bottom:0;width:4px;border-radius:4px;background:var(--line)}
.stage:last-child::before{display:none}
.stage .pin{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink-3);font-weight:900;position:relative;z-index:1}
.stage .pin .ico{width:22px;height:22px}
.stage.past .pin{background:var(--gold);color:#fff;box-shadow:0 3px 0 var(--gold-d)}
.stage.now .pin{background:var(--green);color:#fff;animation:pulse 2s infinite}
.stage ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:14.5px;display:flex;flex-direction:column;gap:3px}
.xrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--line-2)}
.xrow:first-child{border-top:0}
.xrow.gone{opacity:.45}
.xrow.next{background:var(--yellow-t);margin-inline:-16px;padding-inline:16px;border-radius:14px;border-top-color:transparent}
.xrow .cal{width:54px}
.xrow .cal span{font-size:20px}
.xrow .left{margin-left:auto;text-align:right;font-weight:900;font-size:14px;color:var(--ink-2);white-space:nowrap}

/* ---------- subjects ---------- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.scard{--c:var(--green);--cd:var(--green-d);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 12px 16px;border-radius:var(--r-lg);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);background:var(--card);text-decoration:none;color:inherit;transition:transform .08s,box-shadow .08s}
.scard:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.mring{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);position:relative;flex:none}
.mring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--ring-bg,var(--card))}
.mring span{position:relative;width:56px;height:56px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;box-shadow:inset 0 -4px 0 var(--cd)}
.mring .ico{width:30px;height:30px}
.scard h3{font-size:16px}
.scard .tiny{color:var(--ink-2);font-weight:800}
.shero{border-radius:var(--r-lg);padding:18px;background:var(--c);color:#fff;box-shadow:0 5px 0 var(--cd);display:flex;align-items:center;gap:14px;margin-top:10px}
.shero .caps{color:rgba(255,255,255,.85)}
.shero h1{color:#fff}
.shero p{color:rgba(255,255,255,.92);font-weight:700;font-size:14px;margin-top:4px}
.shero .mring{background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.3) 0);--ring-bg:var(--c)}
.shero .mring span{background:rgba(255,255,255,.22);box-shadow:none}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:900;text-decoration:none;color:var(--ink-3);font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding-top:12px}
.back .ico{width:20px;height:20px}
.trow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:2px solid var(--line-2)}
.trow:first-child{border-top:0}
.trow button.tn{appearance:none;border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:800;font-size:15.5px;color:var(--ink);line-height:1.3}
.rate5{display:flex;gap:5px}
.rate5 button{appearance:none;width:32px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:900;font-size:14px;color:var(--ink-3);cursor:pointer;padding:0;transition:transform .08s}
.rate5 button:active{transform:translateY(3px);box-shadow:none}
.rate5 button[aria-pressed="true"]{color:#fff;animation:pop .3s var(--ease)}
.rate5 button[data-r="1"][aria-pressed="true"]{background:var(--c1);border-color:var(--c1);box-shadow:0 3px 0 var(--red-d)}
.rate5 button[data-r="2"][aria-pressed="true"]{background:var(--c2);border-color:var(--c2);box-shadow:0 3px 0 var(--orange-d)}
.rate5 button[data-r="3"][aria-pressed="true"]{background:var(--c3);border-color:var(--c3);box-shadow:0 3px 0 var(--yellow-d);color:#4B3A00}
.rate5 button[data-r="4"][aria-pressed="true"]{background:var(--c4);border-color:var(--c4);box-shadow:0 3px 0 #6BB00A}
.rate5 button[data-r="5"][aria-pressed="true"]{background:var(--c5);border-color:var(--c5);box-shadow:0 3px 0 var(--green-d)}
ul.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-weight:600}
ul.pts li::marker{color:var(--ink-3)}
.given .caps{margin-bottom:6px}
.spec-ref{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline;font-size:14px;margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);font-weight:800}
.legend span{display:inline-flex;align-items:center;gap:6px}
.kp{display:flex;flex-direction:column;gap:10px;counter-reset:k}
.kp div{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-weight:600}
.kp div::before{counter-increment:k;content:counter(k);width:30px;height:30px;border-radius:10px;background:var(--bg-2);display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--ink-2)}

/* ---------- flashcards tab ---------- */
.deckhero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:18px}
.stackart{position:relative;width:120px;height:92px;margin:14px 0 6px}
.stackart i{position:absolute;inset:0;border-radius:16px;border:2px solid var(--line);background:var(--card)}
.stackart i:nth-child(1){transform:rotate(-10deg) translate(-10px,4px);background:var(--purple-t);border-color:var(--purple)}
.stackart i:nth-child(2){transform:rotate(7deg) translate(10px,2px);background:var(--blue-t);border-color:var(--blue)}
.stackart i:nth-child(3){background:var(--green);border-color:var(--green-d);box-shadow:0 5px 0 var(--green-d);display:grid;place-items:center;color:#fff;font-weight:900;font-size:26px;font-style:normal}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:120px}
.boxes div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.boxes i{display:block;width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--bc);min-height:6px;transition:height .5s var(--ease)}
.boxes b{font-weight:900;font-size:13px}
.boxes span{font-size:11px;font-weight:800;color:var(--ink-3)}

/* ---------- settings ---------- */
.field{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:2px solid var(--line-2)}
.field:first-child{border-top:0}
.field .l{font-weight:800}
.field .s{font-size:13.5px;color:var(--ink-2)}
select,input[type=date],input[type=number],input[type=email],input[type=password],textarea{border:2px solid var(--line);border-radius:14px;background:var(--bg-2);padding:10px 12px;min-height:46px;font-weight:700;font-size:16px}
textarea{width:100%;min-height:100px;font:600 13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.switch{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;border:0;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:transform .2s var(--ease)}
.switch:checked{background:var(--green)}
.switch:checked::after{transform:translateX(22px)}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);font-weight:700}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--ink-3);flex:none}
.sync.ok i{background:var(--green)} .sync.warn i{background:var(--orange)}

/* ---------- login ---------- */
.login{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:28px;text-align:center}
.login .appmark{width:84px;height:84px;margin:0 auto;border-radius:26px;background:var(--green);box-shadow:0 6px 0 var(--green-d);display:grid;place-items:center;color:#fff;font-weight:900;font-size:34px;animation:popin .5s var(--ease)}
.login form{display:flex;flex-direction:column;gap:12px;text-align:left}
.login input{width:100%}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-weight:800;font-size:13px;text-transform:uppercase}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}

/* ---------- lesson overlay ---------- */
.sess{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sess[hidden]{display:none}
.l-top{flex:none;display:flex;align-items:center;gap:12px;max-width:640px;width:100%;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 8px}
.x{appearance:none;border:0;background:none;color:var(--ink-3);cursor:pointer;padding:4px;display:grid;place-items:center;border-radius:10px}
.x .ico{width:28px;height:28px}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .5s var(--ease);position:relative}
.pbar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.tpill{appearance:none;display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:5px 9px;font-weight:900;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink-2);cursor:pointer}
.tpill .ico{width:18px;height:18px}
.tpill.on{border-color:var(--blue);color:var(--blue)}
.l-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.l-in{max-width:640px;margin:0 auto;padding:10px 16px 28px;display:flex;flex-direction:column;gap:16px;animation:slidein .3s ease-out}
.l-in h1{font-size:25px}
.kind{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--cd,var(--ink-3))}
.kind i{width:26px;height:26px;border-radius:8px;background:var(--c,var(--ink-3));display:grid;place-items:center;color:#fff}
.kind i .ico{width:16px;height:16px}
.l-foot{flex:none;border-top:2px solid var(--line-2);background:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));transition:background .2s}
.l-foot-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.l-foot .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.l-foot.good{background:var(--green-t);border-top-color:transparent}
.l-foot.bad{background:var(--red-t);border-top-color:transparent}
.fb{display:flex;align-items:center;gap:12px;animation:sheet .28s var(--ease)}
.fb .badge{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;animation:pop .4s var(--ease)}
.fb .badge .ico{width:30px;height:30px}
.good .fb h2{color:var(--green-d)} .good .badge{color:var(--green)}
.bad .fb h2{color:var(--red-d)} .bad .badge{color:var(--red)}
.fb p{font-weight:700;color:var(--ink-2);font-size:14.5px}
.choice{appearance:none;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%;border:2px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:0 4px 0 var(--line);padding:13px 14px;cursor:pointer;font-weight:700;line-height:1.4;transition:transform .08s,box-shadow .08s,background .15s,border-color .15s}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice .cb{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.choice .cb .ico{width:18px;height:18px}
.choice[aria-pressed="true"]{border-color:var(--green);background:var(--green-t);box-shadow:0 4px 0 var(--green)}
.choice[aria-pressed="true"] .cb{background:var(--green);border-color:var(--green);color:#fff;animation:pop .3s var(--ease)}
.choice.rate{align-items:center}
.choice.rate[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-t);box-shadow:0 4px 0 var(--blue)}
.choice.rate .rb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;background:var(--rc)}
.counter{align-self:center;font-weight:900;font-size:15px;color:var(--ink-2);padding:6px 14px;border-radius:99px;background:var(--bg-2)}
.counter.bump{animation:bump .4s var(--ease)}
.fc-wrap{perspective:1200px}
.fc{position:relative;min-height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s var(--ease);user-select:none;-webkit-user-select:none}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-lg);border:2px solid var(--line);box-shadow:0 5px 0 var(--line);background:var(--card);padding:38px 20px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.fc .back-f{transform:rotateY(180deg);border-color:var(--blue);box-shadow:0 5px 0 var(--blue);background:var(--blue-t)}
.fc .q{font-weight:800;font-size:22px;line-height:1.3;text-wrap:balance}
.fc .a{font-weight:800;font-size:20px;line-height:1.35;color:var(--ink);text-wrap:balance}
.fc .src{position:absolute;top:12px;left:14px;right:14px;font-weight:900;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--cd,var(--ink-3));text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .hint{color:var(--ink-3);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.fc-wrap.shake{animation:shake .4s}
.hero-ill{width:116px;height:116px;margin:4px auto 0;border-radius:32px;display:grid;place-items:center;color:#fff;background:var(--c,var(--green));box-shadow:0 6px 0 var(--cd,var(--green-d));animation:popin .4s var(--ease)}
.hero-ill .ico{width:58px;height:58px}
.done-scr{align-items:center;text-align:center;padding-top:30px}
.done-scr h1{font-size:30px;color:var(--gold-d)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border-radius:16px;border:2px solid var(--tc);overflow:hidden;background:var(--tc);animation:popin .45s var(--ease) both}
.tile:nth-child(2){animation-delay:.1s} .tile:nth-child(3){animation-delay:.2s}
.tile b{display:block;color:#fff;font-size:11px;font-weight:900;letter-spacing:.04em;padding:5px 4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--card);border-radius:13px;padding:12px 4px;font-weight:900;font-size:18px;color:var(--tc);white-space:nowrap}
.tile .ico{width:20px;height:20px}
.streakmsg{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:900;color:var(--orange);font-size:17px}
.streakmsg .ico{width:32px;height:32px;animation:wiggle 1s ease-in-out 2}
.num-in{width:96px}

/* ---------- toast, xp float, confetti ---------- */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:800;font-size:14.5px;max-width:calc(100% - 32px);text-align:center;animation:toastin .25s var(--ease)}
.xpfloat{position:fixed;z-index:45;pointer-events:none;font-weight:900;font-size:22px;color:var(--yellow-d);animation:floatup 1s ease-out forwards;white-space:nowrap}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.empty{text-align:center;padding:26px 14px;color:var(--ink-2);font-weight:700}

@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes popin{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sheet{0%{transform:translateY(24px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes toastin{0%{transform:translate(-50%,20px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}
@keyframes slidein{0%{transform:translateX(18px);opacity:0}100%{transform:none;opacity:1}}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.8);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,204,2,.45)}70%{box-shadow:0 0 0 14px rgba(88,204,2,0)}100%{box-shadow:0 0 0 0 rgba(88,204,2,0)}}
@media (min-width:600px){h1{font-size:30px}.path{gap:30px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* practice decks */
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.deck{--c:var(--green);--cd:var(--green-d);display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:14px 16px;border-radius:var(--r-lg);border:2px solid var(--line);border-bottom-width:5px;background:var(--card);transition:transform .08s,border-bottom-width .08s}
.deck:hover{border-color:var(--c)}
.deck:active{transform:translateY(3px);border-bottom-width:2px;margin-bottom:3px}
.deck-ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--c);box-shadow:inset 0 -4px 0 var(--cd);display:grid;place-items:center;color:#fff}
.deck-ic .ico{width:26px;height:26px}
.deck-tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.deck-tx b{font-size:16px;font-weight:900;line-height:1.2}
.deck-tx .tiny{color:var(--ink-2);font-weight:700}
.deck-bar{display:block;height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:5px 0 1px}
.deck-bar i{display:block;height:100%;border-radius:99px;background:var(--c);min-width:0;transition:width .6s var(--ease)}

</style>
</head>
<body>
<header class="top" id="top" hidden></header>
<main class="wrap" id="view"></main>
<nav class="nav" id="nav" aria-label="Main" hidden></nav>
<div class="sess" id="session" hidden role="dialog" aria-modal="true" aria-label="Revision session"></div>
<script>
const RG = { subjects: [] };
/* Maths — Pearson Edexcel GCSE Mathematics 1MA1 (Chesterton exams page) */
RG.subjects.push({
  id: 'maths', name: 'Maths', board: 'Edexcel', spec: '1MA1', quals: 1, share: 0.20,
  tierable: true,
  link: 'https://qualifications.pearson.com/en/qualifications/edexcel-gcses/mathematics-2015.html',
  papers: [
    { id: 'm1', code: '1MA1/1', name: 'Paper 1 · Non-calculator', date: '2027-05-14', time: 'am', dur: 90 },
    { id: 'm2', code: '1MA1/2', name: 'Paper 2 · Calculator', date: '2027-05-27', time: 'am', dur: 90 },
    { id: 'm3', code: '1MA1/3', name: 'Paper 3 · Calculator', date: '2027-06-14', time: 'am', dur: 90 }
  ],
  structure: [
    'Three papers, 1h 30m each, 80 marks each, equal weighting. Paper 1 has no calculator.',
    'Foundation (grades 1–5) or Higher (grades 4–9) — set your tier in Settings.',
    'Any topic can come up on any paper, so every topic is revised for all three.'
  ],
  technique: [
    'About 1 mark per minute. Circle the marks for each question and budget time.',
    'Always show working: most marks are method marks, even when the final answer is wrong.',
    'Underline the instruction: units, decimal places, "give reasons", "show that".',
    'Check your calculator is in Degrees (D) before any trig question.',
    'You get a formula sheet in every paper (trapezium, prism, circles, Pythagoras, trig ratios, compound interest, probability; Higher also the quadratic formula, sine/cosine rules and ½ab sin C). You still need exact trig values, speed/density/pressure, arc and sector, y = mx + c — see "Formula sheet" topic.',
    'Non-calc: practise written multiplication, division and fraction arithmetic until automatic.',
    'Stuck? Write down anything you know (a formula, a labelled diagram). Then move on and come back.'
  ],
  resources: [
    ['Corbettmaths 5-a-day (daily practice)', 'https://corbettmaths.com/5-a-day/gcse/'],
    ['Physics & Maths Tutor (questions by topic)', 'https://www.physicsandmathstutor.com/'],
    ['Edexcel 1MA1 specification & past papers', 'https://qualifications.pearson.com/en/qualifications/edexcel-gcses/mathematics-2015.html']
  ],
  topics: [
    { id: 'm-num', n: 'Primes, HCF, LCM & index laws', w: 3,
      pts: ['Product of prime factors: factor tree, then write with powers — 360 = 2³ × 3² × 5.',
        'HCF = multiply the primes they share (lowest powers). LCM = every prime, highest powers. A Venn diagram helps.',
        'Index laws: aᵐ × aⁿ = aᵐ⁺ⁿ, aᵐ ÷ aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐⁿ, a⁰ = 1.',
        'Negative index = reciprocal: a⁻ⁿ = 1/aⁿ. Fractional index = root: a^(1/n) = ⁿ√a, a^(m/n) = (ⁿ√a)ᵐ.'],
      cards: [['Write 84 as a product of prime factors', '2² × 3 × 7'], ['HCF and LCM of 24 and 36', 'HCF 12, LCM 72'],
        ['Evaluate 8^(2/3)', '(∛8)² = 2² = 4'], ['Evaluate 27^(−1/3)', '1/3'], ['Simplify (x³)⁴ ÷ x⁵', 'x⁷']],
      ex: 'Do 6 mixed questions: two HCF/LCM word problems (e.g. buses leaving together) and four index-law questions including fractional and negative powers.' },
    { id: 'm-frac', n: 'Fractions, percentages & interest', w: 3,
      pts: ['Add/subtract fractions: common denominator. Multiply: tops × tops, bottoms × bottoms. Divide: flip the second and multiply.',
        'Convert mixed numbers to improper fractions before multiplying or dividing.',
        'Multipliers: +15% → × 1.15, −15% → × 0.85. Percentage change = change ÷ original × 100.',
        'Reverse percentage: divide by the multiplier (after a 20% rise, £66 ÷ 1.2 = £55 originally).',
        'Compound interest / growth: amount = P × (multiplier)ⁿ (the compound interest formula is on the formula sheet). Depreciation uses a multiplier below 1.',
        'Recurring decimal → fraction (H): x = 0.4545…, 100x = 45.4545…, subtract: 99x = 45, x = 5/11.'],
      cards: [['Multiplier for a 15% decrease', '0.85'], ['£200 at 3% compound interest for 4 years', '200 × 1.03⁴ = £225.10'],
        ['Price after 20% off is £48. Original price?', '£48 ÷ 0.8 = £60'], ['2⅓ ÷ 1¾', '7/3 × 4/7 = 4/3 = 1⅓'], ['0.4̇5̇ as a fraction', '45/99 = 5/11']],
      ex: 'Non-calculator set: 3 fraction-arithmetic questions, 2 reverse-percentage questions, 1 compound-interest question (calculator).' },
    { id: 'm-bounds', n: 'Rounding, bounds & standard form', w: 2,
      pts: ['Estimate by rounding every number to 1 significant figure first.',
        'Error interval: half a unit either side — 7.3 to 1 d.p. means 7.25 ≤ x < 7.35.',
        'Upper bound of a ÷ b = UB of a ÷ LB of b. Upper bound of a − b = UB a − LB b.',
        'Standard form: A × 10ⁿ with 1 ≤ A < 10. Multiply: multiply the A parts, add the powers, then re-adjust.'],
      cards: [['0.00045 in standard form', '4.5 × 10⁻⁴'], ['(3 × 10⁴) × (4 × 10⁵)', '1.2 × 10¹⁰'],
        ['Error interval for 7.3 (1 d.p.)', '7.25 ≤ x < 7.35'], ['Upper bound of a ÷ b uses…', 'upper bound of a ÷ lower bound of b']],
      ex: 'Do 4 standard-form calculations without a calculator and 2 bounds problems (H: speed = distance ÷ time with bounds).' },
    { id: 'm-surds', n: 'Surds', w: 1, h: 1,
      pts: ['√(ab) = √a × √b. Simplify by finding a square factor: √72 = √36 × √2 = 6√2.',
        'Rationalise: multiply top and bottom by the surd — 1/√3 = √3/3.',
        'For a/(b + √c) multiply top and bottom by the conjugate (b − √c).',
        '(a + √b)(a − √b) = a² − b — a difference of two squares.'],
      cards: [['Simplify √50', '5√2'], ['Rationalise 6/√2', '3√2'], ['(3 + √2)(3 − √2)', '7'], ['√12 + √27', '2√3 + 3√3 = 5√3']],
      ex: 'Do 5 surd questions including one "rationalise with a conjugate" question.' },
    { id: 'm-alg', n: 'Expanding, factorising & algebraic fractions', w: 3,
      pts: ['Double brackets: every term times every term (grid or FOIL). Triple brackets (H): expand two, then the third.',
        'Factorise: take out the HCF first. Quadratic x² + bx + c: find a pair multiplying to c and adding to b.',
        'Difference of two squares: a² − b² = (a + b)(a − b).',
        'ax² + bx + c (H): find two numbers multiplying to ac and adding to b, split the middle term, factorise in pairs.',
        'Algebraic fractions (H): factorise everything first, then cancel common brackets.'],
      cards: [['Factorise x² + 5x + 6', '(x + 2)(x + 3)'], ['Factorise x² − 49', '(x + 7)(x − 7)'],
        ['Expand (2x − 3)(x + 4)', '2x² + 5x − 12'], ['Factorise 2x² + 7x + 3', '(2x + 1)(x + 3)'], ['Simplify (x² − 9)/(x² + 5x + 6)', '(x − 3)/(x + 2)']],
      ex: 'Do 8 factorising questions of increasing difficulty and 2 algebraic-fraction simplifications.' },
    { id: 'm-eq', n: 'Equations, inequalities & rearranging', w: 3,
      pts: ['Do the same to both sides. Collect x terms on the side with more x.',
        'Inequalities: solve like equations, but flip the sign when multiplying or dividing by a negative.',
        'Number lines: open circle for < or >, filled circle for ≤ or ≥. List integers carefully at the ends.',
        'Changing the subject: undo operations in reverse order. If the subject appears twice (H), collect terms and factorise it out.'],
      cards: [['Solve 5x − 7 = 2x + 11', 'x = 6'], ['Solve 3 − 2x > 9', 'x < −3'], ['Integers n with −3 < 2n ≤ 6', '−1, 0, 1, 2, 3'],
        ['Make t the subject: a(t + 1) = 3t + b', 't = (b − a)/(a − 3)']],
      ex: 'Do 4 equations with brackets/fractions, 2 inequalities with number lines, 2 change-the-subject questions.' },

        'White blood cells: phagocytosis, producing antibodies, producing antitoxins.',
        'Vaccination: dead or inactive pathogen → white cells make antibodies and memory cells → fast response later. Herd immunity protects others.',
        'Antibiotics kill bacteria but NOT viruses. Resistance is increasing. Drug testing: pre-clinical (cells, animals) → clinical trials, double-blind with a placebo.'],
      cards: [['Why can\'t antibiotics treat viral infections?', 'Viruses live inside cells; antibiotics only kill bacteria'], ['Three ways white blood cells defend us', 'Phagocytosis, antibodies, antitoxins'],
        ['What is a double-blind trial?', 'Neither patients nor doctors know who gets the drug or the placebo'], ['How is malaria spread?', 'By mosquitoes (vector), protist pathogen'],
        ['How does vaccination work?', 'Inactive pathogen triggers antibodies and memory cells, so a later infection is fought quickly']],
      ex: 'Make a table of the 8 named diseases (pathogen type, spread, symptoms, control), then do one 6-marker on vaccination.' },
    { id: 'b-energy', n: 'Photosynthesis & respiration', p: ['sb1'], w: 3,
      pts: ['Photosynthesis: carbon dioxide + water → glucose + oxygen (light, chlorophyll). 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂. Endothermic.',
        'Limiting factors: light intensity, CO₂ concentration, temperature, amount of chlorophyll.',
        'Inverse square law (H): light intensity ∝ 1/distance².',
        'Glucose is used for respiration, starch (storage), cellulose, fats/oils, and amino acids (with nitrate ions).',
        'Aerobic respiration: glucose + oxygen → carbon dioxide + water. Anaerobic in muscles: glucose → lactic acid (oxygen debt, H). In yeast: glucose → ethanol + carbon dioxide.',
        'Required practical: pondweed at different distances from a lamp — count bubbles or measure O₂ volume.'],
      cards: [['Word equation for photosynthesis', 'Carbon dioxide + water → glucose + oxygen'], ['Word equation for aerobic respiration', 'Glucose + oxygen → carbon dioxide + water'],
        ['Anaerobic respiration in muscles produces…', 'Lactic acid'], ['Anaerobic respiration in yeast produces…', 'Ethanol and carbon dioxide'],
        ['Four limiting factors of photosynthesis', 'Light intensity, CO₂ concentration, temperature, chlorophyll'], ['Why does a graph of rate vs light intensity level off?', 'Another factor (CO₂ or temperature) becomes limiting']],
      ex: 'Do a limiting-factor graph question and a 6-marker describing the pondweed practical.' },

    /* ---------- BIOLOGY PAPER 2 ---------- */
    { id: 'b-nerves', n: 'Nervous system & reaction time', p: ['sb2'], w: 2, from: '2027-01-04',
      pts: ['Homeostasis keeps internal conditions (blood glucose, body temperature, water levels) steady. Control systems have receptors, coordination centres (brain, spinal cord, pancreas) and effectors.',
        'Stimulus → receptor → sensory neurone → relay neurone (CNS) → motor neurone → effector → response.',
        'Reflexes are automatic and rapid, and they do not involve the conscious brain. Synapses pass signals chemically across a gap.',
        'The CNS is the brain and spinal cord.',
        'Required practical: ruler-drop reaction time. Repeat, calculate the mean, control the hand and the distractions.'],
      cards: [['Order of a reflex arc', 'Receptor → sensory → relay → motor → effector'], ['How is a signal passed across a synapse?', 'Chemicals diffuse across the gap'],
        ['Why are reflexes fast?', 'They bypass the conscious part of the brain']],
      ex: 'Label a reflex arc from memory and answer a reaction-time practical question.' },
    { id: 'b-hormones', n: 'Hormones, blood glucose & reproduction', p: ['sb2'], w: 3, from: '2027-01-04',
      pts: ['Endocrine glands release hormones into the blood. The pituitary is the "master gland".',
        'Blood glucose too high → pancreas releases insulin → cells take up glucose, liver stores it as glycogen. Too low → glucagon (H) converts glycogen back.',
        'Type 1 diabetes: the pancreas makes no insulin → injections. Type 2: cells stop responding → diet and exercise. Obesity is a risk factor.',
        'Menstrual cycle: FSH (egg matures, oestrogen made), oestrogen (lining builds), LH (ovulation), progesterone (maintains lining).',
        'Contraception: hormonal (pill, implant, injection) and non-hormonal (condoms, diaphragm, IUD, sterilisation, abstinence).',
        'H: thyroxine and adrenaline, negative feedback, and using hormones to treat infertility (IVF).'],
      cards: [['Hormone that lowers blood glucose', 'Insulin'], ['Difference between Type 1 and Type 2 diabetes', 'Type 1: no insulin made. Type 2: cells don\'t respond to insulin'],
        ['Which hormone triggers ovulation?', 'LH'], ['Role of FSH', 'Causes an egg to mature and stimulates oestrogen production'], ['Where is glycogen stored?', 'Liver (and muscles)']],
      ex: 'Draw the blood-glucose feedback loop, then do a 6-marker comparing hormonal and non-hormonal contraception.' },
    { id: 'b-genetics', n: 'Inheritance & variation', p: ['sb2'], w: 3,
      pts: ['DNA is a double helix polymer. A gene codes for a particular protein. The genome is all of an organism\'s genetic material.',
        'Meiosis makes 4 genetically different gametes with half the chromosomes. Fertilisation restores the full number.',
        'Dominant allele shows with one copy. Recessive needs two. Homozygous = same alleles, heterozygous = different.',
        'Punnett squares give probabilities. Cystic fibrosis is recessive. Polydactyly is dominant.',
        'Sex: XX female, XY male — always a 50% chance of either.',
        'Embryo screening raises ethical, economic and social issues.'],
      cards: [['Define allele', 'A different form of the same gene'], ['Genotype vs phenotype', 'Genotype = alleles; phenotype = characteristic shown'],
        ['Two carriers (Ff × Ff) of cystic fibrosis: chance of an affected child?', '25% (1 in 4)'], ['How many cells does meiosis produce?', 'Four genetically different gametes'],
        ['Is polydactyly dominant or recessive?', 'Dominant']],
      ex: 'Do 3 Punnett-square questions (including a family tree) and one embryo-screening evaluation.' },
    { id: 'b-evolution', n: 'Evolution, breeding & classification', p: ['sb2'], w: 2,
      pts: ['Natural selection: variation → better-adapted individuals survive and breed → pass on alleles → over time the species changes.',
        'Evidence: fossils, antibiotic-resistant bacteria.',
        'Selective breeding: choose parents with desired traits over many generations. Risk: inbreeding and reduced variation.',
        'Genetic engineering: a gene is transferred into another organism (e.g. human insulin gene into bacteria, GM crops).',
        'Classification: Linnaean system (kingdom … species, binomial names). Woese\'s three domains: Archaea, Bacteria, Eukaryota.',
        'Extinction causes: new predators, disease, competition, environmental change, catastrophic events.'],
      cards: [['Why are antibiotic-resistant bacteria evidence for evolution?', 'Resistant bacteria survive and reproduce, so resistance spreads — natural selection seen quickly'],
        ['One risk of selective breeding', 'Inbreeding — reduced variation, vulnerable to disease'], ['Woese\'s three domains', 'Archaea, Bacteria, Eukaryota'],
        ['Example of genetic engineering', 'Human insulin gene put into bacteria']],
      ex: 'Write a 6-mark explanation of how antibiotic resistance develops (natural selection steps in order).' },
    { id: 'b-ecology', n: 'Ecology & biodiversity', p: ['sb2'], w: 3, from: '2026-09-02',
      pts: ['Community = all populations in a habitat. Interdependence: species depend on each other for food, shelter, pollination.',
        'Abiotic factors: light, temperature, moisture, soil pH and minerals, wind, CO₂, O₂. Biotic: food, predators, pathogens, competition.',
        'Adaptations: structural, behavioural, functional. Extremophiles live in extreme conditions.',
        'Predator–prey cycles: predator numbers peak after prey numbers.',
        'Required practical: quadrats (random sampling for abundance) and transects (how distribution changes).',
        'Carbon cycle: photosynthesis removes CO₂; respiration, decomposition and combustion return it. Water cycle: evaporation, condensation, precipitation.',
        'Humans reduce biodiversity through waste, pollution, land use, deforestation (peat bogs, tropical forest) and global warming. Protect it with breeding programmes, hedgerows, reduced deforestation and recycling.'],
      cards: [['Three abiotic factors', 'e.g. light intensity, temperature, soil pH'], ['What is a quadrat used for?', 'Estimating population size / abundance by random sampling'],
        ['What is a transect used for?', 'Showing how distribution changes across a habitat'], ['Two processes that return CO₂ to the air', 'Respiration and combustion (also decomposition)'],
        ['Why does the predator peak come after the prey peak?', 'Predators need time to feed and reproduce after food increases']],
      ex: 'Do a quadrat calculation (mean per quadrat × area) and a 6-marker on the carbon cycle.' },

    /* ---------- CHEMISTRY PAPER 1 ---------- */
    { id: 'c-atoms', n: 'Atoms, the periodic table & separating', p: ['sc1'], w: 3,
      pts: ['Proton: charge +1, mass 1. Neutron: 0, mass 1. Electron: −1, very small mass. Atomic number = protons. Mass number = protons + neutrons.',
        'Isotopes: same number of protons, different number of neutrons.',
        'Model of the atom: tiny spheres → discovery of the electron led to the plum pudding model → alpha scattering showed a small positive nucleus (nuclear model) → Bohr: electrons in shells → Chadwick provided evidence for the neutron.',
        'Electron shells: 2, 8, 8. Group number = outer electrons. Period = number of shells.',
        'Group 1: react with water → metal hydroxide + hydrogen, more reactive down the group. Group 7: less reactive down the group, displacement reactions. Group 0: unreactive (full outer shell).',
        'Separating mixtures: filtration, crystallisation, simple and fractional distillation, chromatography. Mendeleev left gaps for undiscovered elements.'],
      cards: [['Define isotope', 'Atoms of the same element with different numbers of neutrons'], ['What did the alpha-scattering experiment show?', 'Mass is concentrated in a small, positive nucleus'],
        ['Electronic structure of sodium (11)', '2, 8, 1'], ['Why does Group 1 reactivity increase down the group?', 'Outer electron is further from the nucleus, so it is lost more easily'],
        ['Why did Mendeleev leave gaps?', 'For elements not yet discovered, so patterns lined up'], ['Group 1 metal + water →', 'Metal hydroxide + hydrogen']],
      ex: 'Write electron structures for elements 1–20, then do a 6-marker on the development of the atomic model.' },
    { id: 'c-bonding', n: 'Bonding, structure & properties', p: ['sc1'], w: 3,
      pts: ['Ionic: metal + non-metal, electrons transferred, giant lattice, high melting point, conducts when molten or dissolved.',
        'Covalent: non-metals share pairs of electrons. Simple molecules have weak intermolecular forces → low boiling points, don\'t conduct.',
        'Diamond: each C has 4 covalent bonds — very hard, very high melting point, no conduction.',
        'Graphite: each C has 3 bonds, layers slide, delocalised electrons → conducts. Graphene: a single layer. Fullerenes: hollow cages and tubes.',
        'Metallic bonding: positive ions in a sea of delocalised electrons → conducts, malleable. Alloys are harder because different-sized atoms distort the layers.',
        'Draw dot-and-cross diagrams for NaCl, MgO, H₂, Cl₂, H₂O, NH₃, CH₄, HCl.'],
      cards: [['Why does graphite conduct electricity?', 'Each carbon has one delocalised electron that can move'], ['Why are alloys harder than pure metals?', 'Different-sized atoms distort the layers so they cannot slide'],
        ['Why does ionic NaCl have a high melting point?', 'Strong electrostatic forces between oppositely charged ions in a giant lattice need lots of energy to overcome'],
        ['Why do simple molecules have low boiling points?', 'Weak intermolecular forces, not covalent bonds, are broken'], ['When does an ionic compound conduct?', 'When molten or dissolved (ions free to move)']],
      ex: 'Draw 4 dot-and-cross diagrams from memory, then answer a "compare diamond and graphite" 6-marker.' },
    { id: 'c-quant', n: 'Quantitative chemistry', p: ['sc1'], w: 2,
      pts: ['Conservation of mass: total mass of reactants = total mass of products. Mass "lost" is usually a gas escaping.',
        'Relative formula mass (Mr) = sum of the relative atomic masses.',
        'H: moles = mass ÷ Mr. One mole contains 6.02 × 10²³ particles (Avogadro constant).',
        'H: reacting masses — use the mole ratio from the balanced equation. The limiting reactant is used up first.',
        'Concentration (g/dm³) = mass ÷ volume (dm³). 1 dm³ = 1000 cm³.'],
      cards: [['Mr of CO₂ (C = 12, O = 16)', '44'], ['Moles in 88 g of CO₂', '2 mol'], ['Concentration of 10 g in 250 cm³', '40 g/dm³'], ['Avogadro constant', '6.02 × 10²³']],
      ex: 'Do 5 calculations: Mr, % mass, concentration, and (H) two reacting-mass questions.' },
    { id: 'c-changes', n: 'Chemical changes, acids & electrolysis', p: ['sc1'], w: 3,
      pts: ['Reactivity series: K, Na, Li, Ca, Mg, (C), Zn, Fe, (H), Cu. Metals below carbon are extracted by reduction with carbon.',
        'Oxidation is gain of oxygen (H: loss of electrons — OIL RIG).',
        'Acid + metal → salt + hydrogen. Acid + alkali → salt + water. Acid + carbonate → salt + water + carbon dioxide. Neutralisation: H⁺ + OH⁻ → H₂O.',
        'Required practical: making a soluble salt — add excess insoluble base to acid, filter, evaporate, crystallise.',
        'Electrolysis: positive ions to the cathode (−), negative ions to the anode (+). Aluminium from aluminium oxide dissolved in cryolite (lower melting point). Carbon anodes burn away.',
        'Aqueous solutions: hydrogen forms at the cathode if the metal is more reactive than hydrogen. Oxygen forms at the anode unless a halide is present.'],
      cards: [['Acid + carbonate →', 'Salt + water + carbon dioxide'], ['OIL RIG', 'Oxidation Is Loss, Reduction Is Gain (of electrons)'],
        ['Why is aluminium oxide dissolved in cryolite?', 'Lowers the melting point, saving energy'], ['Electrolysis of NaCl solution: product at cathode', 'Hydrogen'],
        ['Why add excess base when making a salt?', 'To make sure all the acid reacts'], ['Why must carbon anodes be replaced?', 'They react with oxygen to form CO₂']],
      ex: 'Write the salt-making method from memory, then predict electrolysis products for 4 solutions.' },
    { id: 'c-energy', n: 'Energy changes', p: ['sc1'], w: 2,
      pts: ['Exothermic: energy released, temperature rises (combustion, neutralisation, hand warmers).',
        'Endothermic: energy taken in, temperature falls (thermal decomposition, sports injury packs).',
        'Reaction profiles: activation energy is the minimum energy needed to react. Exothermic products are lower than reactants.',
        'H: bond energy calculation — energy to break bonds − energy released making bonds. A negative result means exothermic.',
        'Required practical: temperature change in a polystyrene cup with a lid. Vary the concentration or amount of reactant.'],
      cards: [['Is neutralisation exo- or endothermic?', 'Exothermic'], ['Define activation energy', 'Minimum energy particles need to react'],
        ['Why use a polystyrene cup with a lid?', 'Reduces energy lost to the surroundings'], ['Bond energy: breaking > making means…', 'Endothermic overall']],
      ex: 'Sketch both reaction profiles from memory and do one bond-energy calculation (H).' },

    /* ---------- CHEMISTRY PAPER 2 ---------- */
    { id: 'c-rates', n: 'Rates & equilibrium', p: ['sc2'], w: 3,
      pts: ['Rate = amount of reactant used (or product made) ÷ time.',
        'Collision theory: particles must collide with at least the activation energy. More frequent successful collisions = faster reaction.',
        'Rate increases with temperature, concentration or pressure, surface area, and a catalyst (a catalyst lowers the activation energy and is not used up).',
        'Measure it by gas volume (syringe), mass loss, or a "disappearing cross" (sodium thiosulfate + acid). H: gradient of a tangent gives the rate at a point.',
        'Reversible reactions ⇌ reach equilibrium in a closed system (forward rate = backward rate).',
        'H: Le Chatelier — raising the temperature favours the endothermic direction. Raising the pressure favours the side with fewer gas molecules.'],
      cards: [['How does a catalyst increase rate?', 'Provides a pathway with lower activation energy'], ['Why does higher temperature increase rate?', 'Particles move faster → more frequent collisions, and more have enough energy'],
        ['Define equilibrium', 'Forward and reverse reactions happen at the same rate in a closed system'], ['Why does powder react faster than lumps?', 'Larger surface area → more frequent collisions'],
        ['How do you find the rate at a point on a curve? (H)', 'Draw a tangent and calculate its gradient']],
      ex: 'Plot a rate graph from data, draw a tangent (H), and write a 6-marker on the thiosulfate practical.' },
    { id: 'c-organic', n: 'Organic chemistry & crude oil', p: ['sc2'], w: 2, from: '2026-09-02',
      pts: ['Crude oil is a mixture of hydrocarbons, mostly alkanes CₙH₂ₙ₊₂: methane, ethane, propane, butane.',
        'Fractional distillation: heat and vaporise; fractions condense at different heights. Short chains at the top — low boiling point, runny, very flammable.',
        'Complete combustion: hydrocarbon + oxygen → carbon dioxide + water.',
        'Cracking (catalytic or steam) breaks long alkanes into shorter alkanes and alkenes, which are more useful and in higher demand.',
        'Alkenes have a C=C double bond. Test: bromine water goes from orange to colourless.'],
      cards: [['General formula of alkanes', 'CₙH₂ₙ₊₂'], ['Test for alkenes', 'Bromine water: orange → colourless'], ['Why crack long hydrocarbons?', 'To meet demand for shorter, more useful fuels and to make alkenes for polymers'],
        ['Properties of short-chain hydrocarbons', 'Low boiling point, low viscosity, very flammable'], ['Products of complete combustion', 'Carbon dioxide and water']],
      ex: 'Draw and explain the fractionating column, then balance 3 combustion and cracking equations.' },
    { id: 'c-analysis', n: 'Chemical analysis', p: ['sc2'], w: 2, from: '2026-11-02',
      pts: ['A pure substance is a single element or compound, with a sharp melting and boiling point.',
        'Formulations are mixtures in exact proportions for a purpose (paint, medicines, fuels).',
        'Chromatography: Rf = distance moved by the spot ÷ distance moved by the solvent. A pure substance gives one spot. Draw the start line in pencil.',
        'Gas tests: hydrogen — squeaky pop with a lit splint. Oxygen — relights a glowing splint. CO₂ — limewater turns milky. Chlorine — bleaches damp litmus paper.'],
      cards: [['Rf formula', 'Distance moved by spot ÷ distance moved by solvent'], ['Test for oxygen', 'Relights a glowing splint'], ['Test for chlorine', 'Bleaches damp litmus paper white'],
        ['Why draw the chromatography baseline in pencil?', 'Pencil doesn\'t dissolve in the solvent'], ['How do you tell a pure substance?', 'Sharp, specific melting/boiling point']],
      ex: 'Calculate 3 Rf values and answer the chromatography required-practical questions.' },
    { id: 'c-atmos', n: 'The atmosphere', p: ['sc2'], w: 2, from: '2027-01-04',
      pts: ['Early atmosphere: volcanoes released mainly CO₂, with water vapour and nitrogen. Water vapour condensed to form oceans.',
        'Algae and plants photosynthesised → oxygen increased and CO₂ decreased. CO₂ was locked into sedimentary rocks and fossil fuels.',
        'Now: about 80% nitrogen, about 20% oxygen, small amounts of CO₂, water vapour and noble gases.',
        'Greenhouse gases (CO₂, methane, water vapour) absorb infrared radiation. Human activity increases CO₂ (combustion, deforestation) and methane (farming, landfill).',
        'Pollutants: carbon monoxide (toxic, incomplete combustion), sulfur dioxide and nitrogen oxides (acid rain, breathing problems), soot particulates (global dimming).',
        'Carbon footprint = total greenhouse gases over a product\'s life cycle.'],
      cards: [['Main gas in the early atmosphere', 'Carbon dioxide'], ['Why did oxygen increase?', 'Photosynthesis by algae and plants'], ['Why is carbon monoxide dangerous?', 'Toxic — stops blood carrying oxygen'],
        ['Two human sources of methane', 'Farming (cattle, rice) and landfill'], ['Rough composition of air today', '~80% nitrogen, ~20% oxygen']],
      ex: 'Write a 6-marker on how the atmosphere has changed, then a climate-change evaluation.' },
    { id: 'c-resources', n: 'Using resources & water', p: ['sc2'], w: 2, from: '2027-01-04',
      pts: ['Potable water is safe to drink. UK fresh water: filtered, then sterilised (chlorine, ozone or UV). Sea water: desalination by distillation or reverse osmosis (costly in energy).',
        'Waste water: screening → sedimentation → anaerobic digestion of sludge, aerobic treatment of effluent.',
        'H: phytomining (plants absorb metal, then burn to ash) and bioleaching (bacteria) extract low-grade copper ores.',
        'Life cycle assessment: raw materials, manufacture, use, disposal.',
        'Reduce, reuse, recycle to save resources and energy.',
        'Required practical: analyse and purify water — test pH, evaporate to find dissolved solids, distil.'],
      cards: [['Two ways to sterilise water', 'Chlorine, ozone or UV light'], ['Why is desalination expensive?', 'Needs lots of energy'], ['Four stages of a life cycle assessment', 'Raw materials, manufacture, use, disposal'],
        ['What is phytomining? (H)', 'Plants absorb metal compounds; burned to give ash rich in metal']],
      ex: 'Answer a life-cycle-assessment comparison question (e.g. paper vs plastic bags).' },

    /* ---------- PHYSICS PAPER 1 ---------- */
    { id: 'p-energy', n: 'Energy', p: ['sp1'], w: 3,
      pts: ['Energy stores: kinetic, gravitational potential, elastic, thermal, chemical, magnetic, electrostatic, nuclear.',
        'Kinetic energy = ½mv². GPE = mgh. Elastic PE = ½ke².',
        'Specific heat capacity: ΔE = mcΔθ. Required practical: heat a block with an immersion heater, measure energy in and temperature rise.',
        'Power = energy ÷ time = work done ÷ time. Efficiency = useful output ÷ total input.',
        'Reduce unwanted transfers with lubrication and thermal insulation. Thicker, lower-conductivity walls lose heat more slowly.',
        'Resources: renewable (solar, wind, hydro, tidal, wave, geothermal, biofuel) vs non-renewable (coal, oil, gas, nuclear). Compare reliability, cost and environmental impact.'],
      cards: [['Kinetic energy equation', 'Eₖ = ½mv²'], ['GPE equation', 'Eₚ = mgh'], ['Specific heat capacity equation', 'ΔE = mcΔθ'],
        ['Efficiency', 'Useful output ÷ total input'], ['One advantage and one disadvantage of wind power', 'Renewable, no CO₂ / unreliable and visual impact'], ['Unit of power', 'Watt (W) = J/s']],
      ex: 'Do 5 energy calculations (including rearranging ½mv²) and one 6-marker comparing energy resources.' },
    { id: 'p-elec', n: 'Electricity', p: ['sp1'], w: 3,
      pts: ['Charge Q = It. Potential difference V = IR. Power P = VI = I²R. Energy E = Pt = QV.',
        'Series: same current everywhere, p.d. shared, R total = R₁ + R₂. Parallel: same p.d. on each branch, currents add, total R is less than the smallest.',
        'I–V graphs: fixed resistor is a straight line through the origin. Filament lamp curves (resistance rises with temperature). Diode lets current flow one way only.',
        'LDR: resistance falls as light increases. Thermistor: resistance falls as temperature increases.',
        'UK mains: 230 V, 50 Hz a.c. Live (brown), neutral (blue), earth (green/yellow). Fuses and earthing are for safety.',
        'National Grid: step-up transformers raise the p.d. (lower current, less energy loss); step-down transformers make it safe for homes.'],
      cards: [['V = ?', 'IR'], ['Resistance in parallel is…', 'Less than the smallest individual resistor'], ['What happens to an LDR in bright light?', 'Resistance decreases'],
        ['Colour of the live wire', 'Brown'], ['Why does the National Grid use high voltage?', 'Lower current → less energy lost as heat in cables'], ['UK mains frequency and p.d.', '50 Hz, 230 V']],
      ex: 'Do 4 circuit calculations, then sketch the three I–V graphs from memory and explain the filament lamp.' },
    { id: 'p-particles', n: 'Particle model of matter', p: ['sp1'], w: 2,
      pts: ['Density ρ = m ÷ V. Required practical: regular shapes (measure dimensions) and irregular shapes (displacement / eureka can).',
        'Solids → liquids → gases: particles get further apart and move more. Density is usually lowest as a gas.',
        'Internal energy = kinetic + potential energy of the particles. Heating raises temperature OR changes state.',
        'Specific latent heat: E = mL. Fusion = melting/freezing. Vaporisation = boiling/condensing. Temperature stays constant during a change of state.',
        'Gas pressure: particles collide with the walls. Hotter at constant volume → faster particles → more frequent, harder collisions → higher pressure.'],
      cards: [['Density equation', 'ρ = m/V'], ['Why is temperature constant while ice melts?', 'Energy breaks bonds (raises potential energy) instead of kinetic energy'],
        ['Specific latent heat equation', 'E = mL'], ['Why does gas pressure rise when heated in a sealed container?', 'Particles move faster, hitting the walls more often and harder']],
      ex: 'Describe both density practicals, then do 2 latent-heat calculations from a heating curve.' },
    { id: 'p-atomic', n: 'Atomic structure & radiation', p: ['sp1'], w: 3,
      pts: ['Atom radius about 1 × 10⁻¹⁰ m. The nucleus is tiny, containing protons and neutrons.',
        'Alpha: helium nucleus (2p + 2n), most ionising, stopped by paper or a few cm of air. Beta: fast electron, stopped by a few mm of aluminium. Gamma: EM wave, most penetrating (thick lead or concrete).',
        'Nuclear equations: alpha lowers the mass number by 4 and the atomic number by 2. Beta raises the atomic number by 1.',
        'Half-life: time for half the nuclei (or the activity) to halve. Activity is measured in becquerels (Bq).',
        'Contamination = radioactive atoms get on or into something. Irradiation = exposed to radiation (does not become radioactive).',
        'The plum pudding model was replaced after alpha scattering showed a small, dense, positive nucleus.'],
      cards: [['Which radiation is most ionising?', 'Alpha'], ['What stops beta radiation?', 'A few mm of aluminium'], ['Define half-life', 'Time for the number of unstable nuclei (or activity) to halve'],
        ['Alpha decay changes mass and atomic number by…', 'Mass −4, atomic number −2'], ['Contamination vs irradiation', 'Contamination: radioactive material gets on or in an object. Irradiation: object is exposed but not made radioactive'],
        ['Activity 800 Bq, half-life 2 days. Activity after 6 days?', '100 Bq']],
      ex: 'Do 3 half-life questions (one from a graph) and complete 2 nuclear equations.' },

    /* ---------- PHYSICS PAPER 2 ---------- */
    { id: 'p-forces', n: 'Forces & motion', p: ['sp2'], w: 3, from: '2026-09-02',
      pts: ['Scalars have size only (speed, distance, mass). Vectors have size and direction (velocity, displacement, force).',
        'Weight W = mg (g = 9.8 N/kg). Work done W = Fs. Hooke\'s law F = ke (up to the limit of proportionality) — required practical with springs.',
        'Distance–time graph gradient = speed. Velocity–time graph gradient = acceleration; area under it = distance.',
        'Acceleration a = Δv ÷ t. Also v² − u² = 2as.',
        'Newton 1: zero resultant force → constant velocity. Newton 2: F = ma (required practical with a trolley). Newton 3: equal and opposite forces on different objects.',
        'Stopping distance = thinking + braking distance. Tiredness, drugs and alcohol increase thinking distance. Wet or icy roads, worn tyres and brakes increase braking distance.',
        'H: momentum p = mv, and momentum is conserved in collisions.'],
      cards: [['Newton\'s second law', 'F = ma'], ['Gradient of a velocity–time graph', 'Acceleration'], ['Weight equation', 'W = mg'],
        ['Factors affecting thinking distance', 'Speed, tiredness, drugs, alcohol, distractions'], ['Hooke\'s law', 'F = ke'], ['Momentum equation (H)', 'p = mv']],
      ex: 'Do 5 motion calculations (including v² − u² = 2as) and a 6-marker on stopping distances.' },
    { id: 'p-waves', n: 'Waves & the EM spectrum', p: ['sp2'], w: 3,
      pts: ['Transverse: oscillations perpendicular to the direction of travel (light, water waves). Longitudinal: parallel — compressions and rarefactions (sound).',
        'Wave speed v = fλ. Period T = 1/f.',
        'Required practicals: ripple tank and a vibrating string to measure wave speed; infrared emitted from different surfaces (matt black emits and absorbs best).',
        'EM spectrum (increasing frequency): radio, microwaves, infrared, visible, ultraviolet, X-rays, gamma.',
        'Uses: radio (TV/radio), microwaves (satellites, cooking), infrared (heaters, cameras), visible (fibre optics), UV (tanning, energy-efficient lamps), X-rays and gamma (imaging, sterilising, treating cancer).',
        'Dangers: UV causes skin ageing and cancer. X-rays and gamma are ionising — they can cause mutations and cancer.'],
      cards: [['Wave speed equation', 'v = fλ'], ['Order of the EM spectrum', 'Radio, micro, IR, visible, UV, X-ray, gamma'], ['Transverse vs longitudinal', 'Perpendicular vs parallel oscillations'],
        ['Best emitter of infrared', 'Matt black surface'], ['Frequency 50 Hz, wavelength 2 m — speed?', '100 m/s'], ['Two uses of microwaves', 'Satellite communications, cooking']],
      ex: 'Recall the EM spectrum with a use and a danger for each, then do 3 v = fλ calculations with standard form.' },
    { id: 'p-magnet', n: 'Magnetism & electromagnetism', p: ['sp2'], w: 2, from: '2027-01-04',
      pts: ['Like poles repel, unlike poles attract. Field lines go from north to south. Induced magnets are only magnetic inside a field.',
        'A compass points along the field. The Earth has a magnetic field.',

    { id: 'h-ir-peace', n: 'Versailles, the League & 1920s agreements', p: ['h1'], w: 3,

    { id: 'h-ir-interp', n: 'Interpretations: appeasement & the Cold War', p: ['h1'], w: 2,

    { id: 'h-ir-cw1', n: 'The Cold War in Europe 1945–1961', p: ['h1'], w: 3, from: '2026-11-02',

      pts: ['Cuban Missile Crisis (October 1962): Castro\'s revolution (1959) and the failed US-backed Bay of Pigs invasion (1961) → Soviet missiles in Cuba → U-2 photographs → a US naval "quarantine".',

        'Growing involvement under Eisenhower and Kennedy: money, advisers and the Strategic Hamlet programme.',
        'Gulf of Tonkin incident (1964) → the Gulf of Tonkin Resolution gave Johnson power to escalate. 1965: the Rolling Thunder bombing began and US combat troops arrived.'],
      cards: [['How was the Cuban Missile Crisis resolved?', 'USSR removed the missiles; US promised not to invade Cuba and secretly removed missiles from Turkey'],

    { id: 'h-ir-vietnam', n: 'The Vietnam War & US withdrawal 1965–1975', p: ['h1'], w: 3, from: '2027-01-04',

        'Withdrawal: Nixon\'s "Vietnamisation" from 1969 → Paris Peace Accords (1973) → the fall of Saigon (1975) and a communist Vietnam.',

<script>

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));

  s(n) { return new Date(n * 864e5).toISOString().slice(0, 10); },
  today() { if (window.__TODAY) return window.__TODAY; const t = new Date(); return D.s(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / 864e5); },
  add(s, k) { return D.s(D.n(s) + k); },

  short(s) { return D.fmt(s, { weekday: 'short', day: 'numeric', month: 'short' }); },
  long(s) { return D.fmt(s, { weekday: 'long', day: 'numeric', month: 'long' }); },

/* ---------- fixed calendar (Chesterton term dates 2026-27 + JCQ 2027) ---------- */
const EXAM_START = '2027-05-10', EXAM_END = '2027-06-18';
const RESULTS_DAY = '2027-08-19', CONTINGENCY = '2027-06-23';
const HOLIDAYS = [
  ['2026-10-22', '2026-10-30', 'October half term'],
  ['2026-12-12', '2027-01-03', 'Christmas holidays'],
  ['2027-02-15', '2027-02-19', 'February half term'],
  ['2027-03-26', '2027-04-11', 'Easter holidays'],
  ['2027-05-03', '2027-05-03', 'Bank holiday'],
  ['2027-05-31', '2027-06-04', 'May half term'],

const REST_DAYS = { '2026-12-25': 'Christmas Day', '2026-12-26': 'Boxing Day', '2027-01-01': 'New Year\'s Day', '2027-03-28': 'Easter Sunday' };
const ORDER = ['maths', 'science', 'englang', 'englit', 'geog', 'hist', 'german'];
const KEY = 'gcse27.state.v1';

/* ---------- data index ---------- */
RG.subjects.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

for (const s of RG.subjects) {

}
const sortPapers = () => PAPERS.sort((a, b) => a.date.localeCompare(b.date) || (a.time === 'am' ? -1 : 1));
const CARD = {};
for (const t of TOPICS) t.cards && t.cards.forEach((c, i) => { CARD[t.id + '#' + i] = { id: t.id + '#' + i, q: c[0], a: c[1], t }; });

/* ---------- state ---------- */
function defaultState() {
  return {
    v: 1, at: 0,

}
function migrate(s) {

  s.settings = Object.assign(d.settings, s.settings || {});
  s.settings.tiers = Object.assign({ maths: 'H', science: 'H', german: 'H' }, s.settings.tiers || {});
  if (typeof s.at !== 'number') s.at = 0;
  if (!Array.isArray(s.settings.mocks) || s.settings.mocks.length < 2) s.settings.mocks = d.settings.mocks;

}
function readLocal() { try { const r = localStorage.getItem(KEY); if (r) return migrate(JSON.parse(r)); } catch (e) { /* storage unavailable */ } return defaultState(); }

let hadLocal = false;
try { hadLocal = !!localStorage.getItem(KEY); } catch (e) { /* storage unavailable */ }
let state = readLocal();

applySettings();

// cloud.backend: { uid?, load() → {s, at} | null, save({s, at}), watch(cb) → unsubscribe }
// Two backends: the Claude artifact's per-user db, or Firebase (GitHub Pages build, after sign-in).
const cloud = { backend: null, unsub: null, status: 'local', writing: false, pending: false };
let saveTimer = null;
function prune() {
  const cut = D.add(D.today(), -28);
  for (const k of Object.keys(state.plans)) if (k < cut) delete state.plans[k];
  const cut2 = D.add(D.today(), -3);
  for (const k of Object.keys(state.newCards)) if (k < cut2) delete state.newCards[k];
}
// save(): a user edit — stamps the edit time and syncs. saveQuiet(): local only (e.g. generating today's plan).
function save() {

  clearTimeout(saveTimer); saveTimer = setTimeout(pushCloud, 1200);
}
function saveQuiet() { prune(); writeLocal(); }
async function pushCloud() {
  if (!cloud.backend) return;
  if (cloud.writing) { cloud.pending = true; return; }
  cloud.writing = true;
  const be = cloud.backend;
  try { await be.save({ s: JSON.stringify(state), at: state.at }); if (cloud.backend === be) cloud.status = 'synced'; }
  catch (e) { cloud.status = e && (e.code === 'invalid_argument' || e.code === 'permission-denied') ? 'readonly' : 'error'; }

}
function adoptRemote(d) {

}
async function connectBackend(be) {
  disconnectBackend();

  try {
    const d = await be.load();
    if (cloud.backend !== be) return;
    const otherOwner = be.uid && state.owner && state.owner !== be.uid;
    if (d && (otherOwner || (!hadLocal && !state.at) || d.at > (state.at || 0))) adoptRemote(d);
    else if (otherOwner) { state = defaultState(); applySettings(); render(); }
    if (be.uid && state.owner !== be.uid) { state.owner = be.uid; writeLocal(); }
    if (!d || d.at < state.at) { if (state.at) pushCloud(); }

    cloud.unsub = be.watch((r) => { if (r && r.at > (state.at || 0)) adoptRemote(r); }, () => { cloud.status = 'error'; updateSync(); });

}

}
// Claude artifact: progress lives in this viewer's private db subtree.
async function initClaudeCloud(tries) {
  if (window.RGAuth) return; // Firebase build handles sync itself

  if (!c || typeof c.use !== 'function') { if ((tries || 0) < 10) setTimeout(() => initClaudeCloud((tries || 0) + 1), 400); return; }
  try {
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    if (!db || !user) { updateSync(); return; }
    const uid = await user.id();
    if (!uid) { updateSync(); return; }
    const ref = db.doc('data/users/' + uid + '/progress');
    connectBackend({
      load: async () => { const s = await ref.get(); return s.exists ? s.data() : null; },
      save: (d) => ref.set(d),
      watch: (cb, err) => ref.onSnapshot((s) => { if (s.exists && !s.metadata.hasPendingWrites) cb(s.data()); }, err),

  } catch (e) { cloud.status = 'local'; updateSync(); }
}
// Firebase (GitHub Pages build): accounts via email/password or Google.
const auth = { available: false, checked: false, user: null, error: '', busy: false };
const SKIP_KEY = 'gcse27.skipLogin';
let skipMem = false;
function skipLogin() { if (skipMem) return true; try { return localStorage.getItem(SKIP_KEY) === '1'; } catch (e) { return false; } }
function setSkipLogin(v) { skipMem = !!v; try { if (v) localStorage.setItem(SKIP_KEY, '1'); else localStorage.removeItem(SKIP_KEY); } catch (e) { /* storage unavailable */ } }
function initFirebaseAuth() {

    auth.checked = true; auth.user = user || null;

}
function needsLogin() { return auth.available && auth.checked && !auth.user && !skipLogin(); }

let authGaveUp = false;
function authPending() { const c = window.FIREBASE_CONFIG; return !!(c && c.apiKey) && !auth.checked && !authGaveUp; }
